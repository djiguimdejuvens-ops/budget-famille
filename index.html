try{ const u=JSON.parse(localStorage.getItem('budgetV3_ui')||'{}'); TAB=u.tab||TAB;AMODE=u.amode||AMODE;BSCOPE=u.bscope||BSCOPE;BPER=u.bper||BPER;UICUR=u.cur||UICUR;UIMKT=u.mkt||UIMKT;ISUB=u.isub||ISUB;ASCOPE=u.ascope||ASCOPE;APER=u.aper||APER; }catch(e){}

const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MSHORT=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
function Y(){ return state.years[YEARK]; }
const FX=()=> (state.fx&&state.fx.FCFA)||0.001524;

function personIncome(p,m){ const P=Y().persons[p]; if(!P)return 0; let v=P.salary[m]||0; (P.extras||[]).forEach(e=>v+=(e.amounts[m]||0)); return v; }
function personPersoIncome(p,m){ const P=Y().persons[p]; if(!P)return 0; return (P.persoExtras||[]).reduce((s,e)=>s+(e.amounts[m]||0),0); }
function personFullIncome(p,m){ return personIncome(p,m)+personPersoIncome(p,m); }
function incomeTotal(m){ return people.reduce((s,p)=>s+personIncome(p,m),0); }
function prorata(p,m){ const t=incomeTotal(m); return t>0? personIncome(p,m)/t : 1/people.length; }
function foyerGroups(){ const s=[]; Y().foyer.forEach(l=>{ if(!s.includes(l.group))s.push(l.group); }); return s; }
function foyerGroupTotal(g,m,f){ return Y().foyer.filter(l=>l.group===g).reduce((s,l)=>s+(l[f][m]||0),0); }
function foyerTotal(m,f){ return Y().foyer.reduce((s,l)=>s+(l[f][m]||0),0); }
function catVal(p,l,m,f){ if(l.auto) return Math.round((l.rate||10)/100*personFullIncome(p,m)); return l[f][m]||0; }
function persoGroups(p){ const s=[]; (Y().persons[p].cats||[]).forEach(l=>{ if(!s.includes(l.group))s.push(l.group); }); return s; }
function persoGroupTotal(p,g,m,f){ return (Y().persons[p].cats||[]).filter(l=>l.group===g).reduce((s,l)=>s+catVal(p,l,m,f),0); }
function persoTotal(p,m,f){ return (Y().persons[p].cats||[]).reduce((s,c)=>s+catVal(p,c,m,f),0); }
function communeShare(p,m,f){ return prorata(p,m)*foyerTotal(m,f); }
function epargne(p,m,f){ return personFullIncome(p,m)-persoTotal(p,m,f)-communeShare(p,m,f); }
function realizedMonth(m){ if(foyerTotal(m,'real')>0)return true; return people.some(p=>(Y().persons[p].cats||[]).some(l=>!l.auto&&(l.real[m]||0)>0)); }
function fOf(m){ return realizedMonth(m)?'real':'planned'; }
function isSaving(g){ return /épargne|epargne|investiss/i.test(g||''); }
function commonSaving(m,f){ return Y().foyer.filter(l=>isSaving(l.group)).reduce((s,l)=>s+(l[f][m]||0),0); }
function epargneProj(p,m){ return realizedMonth(m)? epargne(p,m,'real') : epargne(p,m,'planned'); }
function personSaving(p){ let s=0; for(let m=0;m<12;m++) s+=epargneProj(p,m)+prorata(p,m)*(realizedMonth(m)?commonSaving(m,'real'):commonSaving(m,'planned')); return s; }
function coupleSaving(){ let s=0; for(let m=0;m<12;m++){ people.forEach(p=>s+=epargneProj(p,m)); s+=(realizedMonth(m)?commonSaving(m,'real'):commonSaving(m,'planned')); } return s; }
function sumM(fn){ let s=0; for(let m=0;m<12;m++)s+=fn(m); return s; }
const EXC={deblocage:{cash:1,patr:0,lbl:'Déblocage épargne / PEE'},emprunt:{cash:1,patr:0,lbl:'Emprunt reçu'},revenu:{cash:1,patr:1,lbl:'Revenu exceptionnel'},remboursement:{cash:-1,patr:0,lbl:"Remboursement d'emprunt"},investissement:{cash:-1,patr:0,lbl:"Placement / achat d'actif"},conso:{cash:-1,patr:-1,lbl:'Conso exceptionnelle'},don:{cash:-1,patr:-1,lbl:'Don'}};
function excList(){ return (Y().exceptional)||[]; }
function excNat(k){ return EXC[k]||EXC.conso; }
function transList(){ return (Y().transfers)||[]; }
function trFee(t){ return t.feeMode==='pct'? (t.eur||0)*(t.fees||0)/100 : (t.fees||0); }

function num(n){ n=Number(n)||0; const neg=n<0; n=Math.abs(n); let s; if(n<50){ const r=Math.round(n*10)/10; s=(Number.isInteger(r)?String(r):r.toFixed(1)).replace('.',','); } else s=Math.round(n).toLocaleString('fr-FR'); return (neg?'-':'')+s; }
function eur(n){ return num(n)+' €'; }
function pctI(x){ return Math.round(x*100)+' %'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDT(ts){ if(!ts) return ''; const d=new Date(ts), p=n=>String(n).padStart(2,'0'); return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function qtyFmt(n){ n=+n||0; if(n===0)return'0'; const a=Math.abs(n); if(a<1)return n.toFixed(6).replace(/0+$/,'').replace('.',','); if(a<1000&&!Number.isInteger(n))return n.toFixed(2).replace('.',','); return Math.round(n).toLocaleString('fr-FR'); }

const PAL=['#3b82f6','#f97316','#8b5cf6','#14b8a6','#ec4899','#f59e0b','#a855f7','#22c55e','#6366f1','#ef4444','#06b6d4','#84cc16','#eab308','#f472b6','#0ea5e9','#fb7185'];
const ICONMAP={'loyer':'🏠','charge':'🏠','électri':'💡','electri':'💡','eau':'💧','assur':'🛡️','course':'🛒','aliment':'🛒','narwal':'🧽','abonnement':'📱','box':'📶','internet':'📶','audible':'🎧','netflix':'🎬','prime':'📦','youtube':'▶️','cloud':'☁️','apple':'☁️','voiture':'🚗','parking':'🅿️','transport':'🚆','déplac':'🚗','deplac':'🚗','santé':'🩺','sante':'🩺','médic':'🩺','banc':'🏦','imprévu':'⚡','imprevu':'⚡','variable':'⚡','déménag':'📦','demenag':'📦','loisir':'🎉','sortie':'🍹','resto':'🍽️','vacance':'✈️','noël':'🎄','noel':'🎄','cadeau':'🎁','mariage':'💍','péage':'🛣️','peage':'🛣️','épargne':'🐷','epargne':'🐷','projet':'🎯','sécurité':'🛟','securite':'🛟','invest':'📈','dîme':'⛪','dime':'⛪','obligatoire':'📌','sport':'🏋️','vêtement':'👕','vetement':'👕','coiffure':'💇','soin':'💆','salaire':'💰','autre':'➕','perso':'👛','bitcoin':'₿','ethereum':'Ξ'};
function catStyle(name,i){ const t=(name||'').toLowerCase(); let e='💠'; for(const k in ICONMAP){ if(t.includes(k)){ e=ICONMAP[k]; break; } } let h=0; for(const c of t)h=(h*31+c.charCodeAt(0))>>>0; return {emoji:e,color:PAL[(i!=null?i:h)%PAL.length]}; }
function tint(hex){ return hex+'22'; }

function donut(slices,big,sub){
  const total=slices.reduce((s,x)=>s+Math.max(0,x.value),0)||1; const R=54,C=2*Math.PI*R; let off=0;
  const rings=slices.filter(s=>s.value>0).map(s=>{ const len=s.value/total*C; const seg=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)" style="cursor:pointer"><title>${esc(s.label||'')}</title></circle>`; off+=len; return seg; }).join('');
  return `<div class="donutwrap"><svg width="172" height="172" viewBox="0 0 140 140">${rings}<text x="70" y="66" text-anchor="middle" fill="var(--ink)" style="font:850 19px -apple-system">${esc(big)}</text><text x="70" y="86" text-anchor="middle" fill="var(--muted)" style="font:600 11px -apple-system">${esc(sub)}</text></svg></div>`;
}
function progress(pct,color){ const w=Math.max(0,Math.min(100,pct*100)); return `<div class="bar"><i style="width:${w}%;background:${color||'var(--accent)'}"></i></div>`; }
// barre avec repère « cumulé théorique » (trait vertical = où tu devrais en être à date)
function progressMark(fillPct,markPct,color){ const w=Math.max(0,Math.min(100,fillPct*100)); const mk=Math.max(0,Math.min(100,markPct*100)); return `<div class="bar" style="position:relative;overflow:visible;margin-top:9px"><i style="width:${w}%;background:${color||'var(--accent)'}"></i><span title="Cumulé théorique — où tu devrais en être à date" style="position:absolute;top:-4px;bottom:-4px;left:calc(${mk}% - 1px);width:2.5px;background:var(--ink);opacity:.7;border-radius:3px"></span></div>`; }
function closedMonths(){ const a=[]; for(let m=0;m<12;m++) if(realizedMonth(m)) a.push(m); return a; }
function barChart(vals,labels,color){ const max=Math.max(1,...vals.map(v=>Math.abs(v))); return `<div class="chartbars">${vals.map((v,i)=>`<div class="cb" title="${esc(labels[i])} : ${eur(v)}"><i style="height:${Math.max(2,Math.abs(v)/max*104)}px;background:${v<0?'var(--red)':(color||'var(--accent)')}"></i><small>${esc((labels[i]||'')[0]||'')}</small></div>`).join('')}</div>`; }
function lineChart(vals,labels){
  const W=320,H=110,pad=6; const min=Math.min(0,...vals),max=Math.max(1,...vals),rng=(max-min)||1;
  const pts=vals.map((v,i)=>[pad+i*(W-2*pad)/Math.max(1,vals.length-1), H-pad-(v-min)/rng*(H-2*pad)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L ${pts[pts.length-1][0].toFixed(1)} ${H-pad} L ${pts[0][0].toFixed(1)} ${H-pad} Z`;
  const zero=H-pad-(0-min)/rng*(H-2*pad); const sp=(W-2*pad)/Math.max(1,vals.length-1);
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.2" fill="var(--accent)"/>`).join('');
  const bands=pts.map((p,i)=>`<rect x="${(p[0]-sp/2).toFixed(1)}" y="0" width="${sp.toFixed(1)}" height="${H}" fill="transparent" style="cursor:pointer"><title>${esc((labels&&labels[i])||('#'+(i+1)))} : ${eur(vals[i])}</title></rect>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none"><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--line)" stroke-width="1"/><path d="${area}" fill="url(#lg)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${bands}</svg>`;
}
function catRow(name,amount,subtitle,i,opts){ opts=opts||{}; const st=opts.style||catStyle(name,i);
  return `<div class="row ${opts.onclick?'clk':''}" ${opts.frow?`data-invrow="${esc(opts.frow)}"`:''} ${opts.onclick?`onclick="${opts.onclick}"`:''}>
    <div class="ic ${opts.sm?'sm':''}" style="background:${tint(st.color)};color:${st.color}">${opts.avatar||st.emoji}</div>
    <div class="nm"><b>${esc(name)}</b><span>${esc(subtitle||'')}</span></div>
    <div class="amt">${opts.amtHtml||eur(amount)}${opts.amtSub?`<small>${esc(opts.amtSub)}</small>`:''}</div>${opts.onclick?'<div class="chev">›</div>':''}</div>`;
}

function pfMarket(sgi){ const s=(sgi||'').toLowerCase(); if(/coris|brvm/.test(s))return'BRVM'; if(/binance|okx|crypto|bitcoin|ether|coin|btc|eth/.test(s))return'Crypto'; if(/fortuneo|euronext|bourso|pea/.test(s))return'Euronext'; return'Autre'; }
function eurOf(v,dev){ return dev==='XOF'? v*FX() : v; }
function dispEur(v){ return UICUR==='XOF'? v/FX() : v; }
function money(vEur,signed){ const x=dispEur(vEur); const s=UICUR==='XOF'? Math.round(x).toLocaleString('fr-FR')+' FCFA' : num(x)+' €'; return (signed&&vEur>0?'+':'')+s; }
function hasPf(){ return state.pf&&state.pf.ops&&state.pf.ops.length; }
function pfValueEur(){ if(!hasPf())return 0; return pfPositions().reduce((s,p)=>s+eurOf(p.val,p.dev),0); }
function pfCashEur(){ if(!hasPf())return 0; const c=pfCash(); return Object.keys(c).reduce((s,sgi)=>s+eurOf(c[sgi].amt,c[sgi].dev),0); }
function toEUR(v,dev){ v=+v||0; if(!dev||dev==='EUR')return v; if(dev==='XOF'||dev==='FCFA')return v*FX(); return v*((state.fx&&state.fx[dev])||1); }
function pfPositions(){ const pos={}; (state.pf.ops||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(o=>{ if(o.type!=='achat'&&o.type!=='vente')return; const k=(o.sgi||'?')+'|'+(o.titre||'?'); if(!pos[k])pos[k]={sgi:o.sgi,titre:o.titre,dev:o.devise||'EUR',qty:0,cost:0}; const P=pos[k],q=+o.qty||0,pr=+o.price||0,fr=+o.fees||0; if(o.type==='achat'){P.qty+=q;P.cost+=q*pr+fr;}else{const cmp=P.qty?P.cost/P.qty:0;P.cost-=cmp*Math.min(q,P.qty);P.qty-=q;if(P.qty<1e-6){P.qty=0;P.cost=0;}} });
  return Object.values(pos).filter(p=>p.qty>1e-6).map(p=>{ const cmp=p.qty?p.cost/p.qty:0,key=p.sgi+'|'+p.titre; const price=(state.pf.prices&&state.pf.prices[key]!=null&&state.pf.prices[key]!=='')?+state.pf.prices[key]:cmp; const val=p.qty*price; return {sgi:p.sgi,titre:p.titre,dev:p.dev,qty:p.qty,cmp,price,val,pv:val-p.qty*cmp,vp:cmp?(price-cmp)/cmp:0,key}; }).sort((a,b)=>eurOf(b.val,b.dev)-eurOf(a.val,a.dev)); }
function pfCash(){ const c={}; (state.pf.ops||[]).forEach(o=>{ const dev=o.devise||'EUR',sgi=o.sgi||'?'; if(!c[sgi])c[sgi]={dev,amt:0}; const x=c[sgi]; if(o.type==='depot'||o.type==='dividende')x.amt+=(+o.amount||0); else if(o.type==='retrait'||o.type==='frais')x.amt-=(+o.amount||0); else if(o.type==='achat')x.amt-=((+o.qty||0)*(+o.price||0)+(+o.fees||0)); else if(o.type==='vente')x.amt+=((+o.qty||0)*(+o.price||0)-(+o.fees||0)); }); return c; }
function pfRealized(mkt){ const run={}; let realized=0; (state.pf.ops||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(o=>{ if(mkt&&mkt!=='all'&&pfMarket(o.sgi)!==mkt)return; const dev=o.devise||'EUR'; const k=(o.sgi||'?')+'|'+(o.titre||'?'); if(o.type==='achat'){ const p=run[k]||(run[k]={qty:0,cost:0}); p.qty+=(+o.qty||0); p.cost+=(+o.qty||0)*(+o.price||0)+(+o.fees||0);} else if(o.type==='vente'){ const p=run[k]||(run[k]={qty:0,cost:0}); const cmp=p.qty?p.cost/p.qty:0; const q=+o.qty||0; realized+=eurOf(q*(+o.price||0)-(+o.fees||0)-cmp*q,dev); p.cost-=cmp*Math.min(q,p.qty); p.qty-=q; if(p.qty<1e-6){p.qty=0;p.cost=0;} } }); return realized; }

function monthSel(){ return `<div class="monthsel"><button class="chip" onclick="chgMonth(-1)">‹</button><div class="m">${esc(MONTHS[MONTH])} ${YEARK}</div><button class="chip" onclick="chgMonth(1)">›</button></div>`; }

function secAccueil(){
  setTitle('Accueil');
  const m=MONTH,f=fOf(m);
  const rev=people.reduce((s,p)=>s+personFullIncome(p,m),0);
  const dep=foyerTotal(m,f)+people.reduce((s,p)=>s+persoTotal(p,m,f),0);
  const net=rev-dep;
  let h=monthSel();
  h+=`<div class="card"><div class="hero"><div class="lbl">Épargne du mois · ${esc(MONTHS[m])}</div><div class="big ${net>=0?'pos':'neg'}">${net>=0?'+':''}${eur(net)}</div><div class="sub">${eur(rev)} de revenus · ${eur(dep)} de dépenses</div></div></div>`;
  const savY=coupleSaving(); const pfNet = hasPf()? (pfPositions().reduce((s,p)=>s+eurOf(p.val,p.dev),0)+Object.values(pfCash()).reduce((s,c)=>s+eurOf(c.amt,c.dev),0)) : 0;
  h+=`<div class="kgrid">${kpi('💰 Revenus couple',eur(rev))}${kpi('💸 Dépenses',eur(dep))}${kpi('🐷 Épargne / mois',eur(net),net>=0?'pos':'neg')}${kpi('📊 Taux d\'épargne',rev>0?pctI(net/rev):'—')}${kpi('🎯 Épargne projetée '+YEARK,eur(savY),savY>=0?'pos':'neg')}${hasPf()?kpi('💼 Portefeuille',eur(pfNet)):kpi('🏦 Solde départ',eur(state.startCash||0))}</div>`;
  const closed=[]; for(let mm=0;mm<12;mm++) if(realizedMonth(mm)) closed.push(mm);
  if(closed.length){ const revD=closed.reduce((s,mm)=>s+people.reduce((a,p)=>a+personFullIncome(p,mm),0),0); const depD=closed.reduce((s,mm)=>s+foyerTotal(mm,'real')+people.reduce((a,p)=>a+persoTotal(p,mm,'real'),0),0);
    h+=`<div class="sec"><h2>Depuis janvier · ${closed.length} mois saisis</h2></div><div class="card"><div class="grid2"><div class="kpi"><div class="k">Revenus à date</div><div class="v pos">${eur(revD)}</div></div><div class="kpi"><div class="k">Dépenses à date</div><div class="v">${eur(depD)}</div></div></div><div class="barlbl" style="margin-top:12px"><b>Épargne réelle cumulée</b><span class="pill ${revD-depD>=0?'g':'r'}">${eur(revD-depD)}</span></div></div>`; }
  const alerts=[]; if(realizedMonth(m)){ foyerGroups().forEach(g=>{ const pl=foyerGroupTotal(g,m,'planned'),re=foyerGroupTotal(g,m,'real'); if(pl>0&&re>pl*1.05) alerts.push({n:g,pl,re}); }); }
  if(alerts.length){ h+=`<div class="sec"><h2>⚠️ À surveiller ce mois</h2></div><div class="card">`; alerts.slice(0,5).forEach((a,i)=>h+=catRow(a.n,a.re,'prévu '+eur(a.pl),i,{amtSub:'+'+eur(a.re-a.pl)})); h+=`</div>`; }
  const cols=['#6c5ce7','#14b8a6','#f59e0b','#ec4899'];
  h+=`<div class="sec"><h2>Répartition du couple</h2></div><div class="card"><div class="pbar">${people.map((p,i)=>`<i style="width:${(prorata(p,m)*100).toFixed(1)}%;background:${cols[i%4]}"></i>`).join('')}</div><div class="plegend">${people.map((p,i)=>`<div class="li"><span class="dot" style="background:${cols[i%4]}"></span><b style="color:var(--ink)">${esc(p)}</b> ${pctI(prorata(p,m))}</div>`).join('')}</div></div>`;
  return h;
}

function secAnalyse(){
  setTitle('Analyse');
  const scopes=['Foyer',...people];
  let h=`<div class="seg">${scopes.map(s=>`<button class="${ASCOPE===s?'on':''}" onclick="setUI('ascope','${jsq(s)}')">${esc(s)}</button>`).join('')}</div>`;
  h+=`<div class="seg sub"><button class="${APER==='mois'?'on':''}" onclick="setUI('aper','mois')">Mois</button><button class="${APER==='annee'?'on':''}" onclick="setUI('aper','annee')">Année ${YEARK}</button></div>`;
  if(APER==='mois') h+=monthSel();
  h+=`<div class="seg sub"><button class="${AMODE==='entrees'?'on':''}" onclick="setUI('amode','entrees')">Entrées</button><button class="${AMODE==='sorties'?'on':''}" onclick="setUI('amode','sorties')">Sorties</button></div>`;
  const per=APER==='mois', scope=ASCOPE, ff=(m)=> per? fOf(m):'planned', M=(fn)=> per? fn(MONTH):sumM(fn);
  let items=[],center;
  if(AMODE==='entrees'){ center='Revenus'; const pl= scope==='Foyer'? people:[scope];
    const sal=M(m=>pl.reduce((s,p)=>s+(Y().persons[p].salary[m]||0),0)); if(sal>0)items.push({name:'Salaire'+(scope==='Foyer'?'s':''),amount:sal});
    pl.forEach(p=>{ (Y().persons[p].extras||[]).forEach(e=>{ const v=M(m=>e.amounts[m]||0); if(v>0)items.push({name:(e.name||'Autre entrée')+(scope==='Foyer'?' · '+p:''),amount:v}); }); (Y().persons[p].persoExtras||[]).forEach(e=>{ const v=M(m=>e.amounts[m]||0); if(v>0)items.push({name:(e.name||'Revenu perso')+(scope==='Foyer'?' · '+p:''),amount:v}); }); });

  if(pos.length){ const slices=pos.map((p,i)=>({value:eurOf(p.val,p.dev),color:catStyle(p.titre,i).color})); h+=`<div class="card">${donut(slices,money(valE),'Titres')}<div class="note" style="text-align:center">Répartition par titre</div></div>`; }
  h+=`<div class="sec"><h2>Mes positions</h2><span class="lnk" onclick="setUI('isub','journal')">Journal ›</span></div>`;
  if(pos.length>4) h+=`<input id="pfsearch" type="text" placeholder="🔎 filtrer par titre / marché" value="${esc(PFQ)}" style="width:100%;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;margin-bottom:8px">`;
  h+=`<div class="card">`;
  if(!pos.length)h+=`<div class="note" style="text-align:center;padding:12px">Aucune position sur ce marché.</div>`;
  pos.forEach((p,i)=>h+=catRow(p.titre, eurOf(p.val,p.dev), p.sgi+' · '+qtyFmt(p.qty)+' × '+num(dispEur(eurOf(p.price,p.dev))), i, {frow:p.titre+' '+p.sgi, amtHtml:money(eurOf(p.val,p.dev)), amtSub:(p.pv>=0?'+':'')+money(eurOf(p.pv,p.dev))+' ('+(p.vp>=0?'+':'')+pctI(p.vp)+')'})); h+=`</div>`;
  return h;
}

  const clean=x=>{ const v=parseFloat((''+x).replace(/[\s]/g,'').replace(',','.')); return isNaN(v)?0:v; };
  const fnum=s=>{ if(s==null)return 0; let v=(''+s).replace(/[\s]/g,'').replace(/[^\d.,\-]/g,'').replace(',','.'); v=parseFloat(v); return isNaN(v)?0:v; };
  const frdate=s=>{ s=(''+s).trim(); let m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if(m){ let y=m[3]; if(y.length===2)y='20'+y; return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); } m=s.match(/(\d{4})-(\d{2})-(\d{2})/); if(m)return m[0]; const n=parseFloat((''+s).replace(',','.')); if(n>40000&&n<60000){ const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000); return d.toISOString().slice(0,10); } return s; };
  const nrm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const lines=(txt||'').replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='');
  if(!lines.length)return [];
  const delim=lines[0].indexOf('\t')>=0?'\t':(lines[0].indexOf(';')>=0?';':null);
  const split=l=>delim?l.split(delim).map(s=>s.trim()):l.split(/\s{2,}/).map(s=>s.trim());
  let idx={type:0,date:1,lib:3,brut:4,frais:5,taxe:6,deb:7,cred:8},start=0;
  const h0=split(lines[0]).map(nrm);
  if(h0.some(x=>x.indexOf('libell')>=0)){ const find=(...ps)=>h0.findIndex(x=>ps.some(p=>x.indexOf(p)>=0)); idx={type:find('type','mvt'),date:find('date'),lib:find('libell'),brut:find('brut'),frais:find('frais'),taxe:find('taxe'),deb:find('debit'),cred:find('credit')}; start=1; }
  const g=(f,i)=>(i>=0&&i<f.length)?f[i]:'';
  const ops=[];
  for(let i=start;i<lines.length;i++){ const f=split(lines[i]); if(f.length<3)continue;
    const nT=nrm(g(f,idx.type)); const lib=g(f,idx.lib)||''; const brut=fnum(g(f,idx.brut)),frais=fnum(g(f,idx.frais)),taxe=fnum(g(f,idx.taxe)),deb=fnum(g(f,idx.deb)),cred=fnum(g(f,idx.cred)); const date=frdate(g(f,idx.date));
    const ma=lib.match(/Achat\s+([\d\s]+?)\s+([A-Za-z][A-Za-z0-9]*)\s*\(\s*Cours\s*:?\s*([\d\s.,]+)\)/i);
    const mv=lib.match(/Vente\s+([\d\s]+?)\s+([A-Za-z][A-Za-z0-9]*)\s*\(\s*Cours\s*:?\s*([\d\s.,]+)\)/i);
    const mdv=lib.match(/DIVIDENDES?\s+[\d\s]+\s+([A-Za-z][A-Za-z0-9]*)/i);
    if(nT.indexOf('achat')>=0&&ma)ops.push({date,sgi:'Coris Bourse',type:'achat',titre:ma[2].toUpperCase(),qty:clean(ma[1]),price:clean(ma[3]),fees:frais+taxe,amount:brut,devise:'XOF'});
    else if(nT.indexOf('vente')>=0&&mv)ops.push({date,sgi:'Coris Bourse',type:'vente',titre:mv[2].toUpperCase(),qty:clean(mv[1]),price:clean(mv[3]),fees:frais+taxe,amount:brut,devise:'XOF'});
    else if(nT.indexOf('depot')>=0||nT.indexOf('versement')>=0||nT.indexOf('virement')>=0)ops.push({date,sgi:'Coris Bourse',type:'depot',titre:'',qty:0,price:0,fees:0,amount:cred||brut,devise:'XOF'});
    else if(nT.indexOf('dividende')>=0)ops.push({date,sgi:'Coris Bourse',type:'dividende',titre:mdv?mdv[1].toUpperCase():'',qty:0,price:0,fees:0,amount:cred||brut,devise:'XOF'});
    else if(nT.indexOf('retrait')>=0)ops.push({date,sgi:'Coris Bourse',type:'retrait',titre:'',qty:0,price:0,fees:0,amount:deb||brut,devise:'XOF'});
    else if(nT.indexOf('tenue')>=0||nT.indexOf('frais')>=0||nT.indexOf('facturation')>=0||nT.indexOf('commission')>=0)ops.push({date,sgi:'Coris Bourse',type:'frais',titre:(lib||'Frais').slice(0,48),qty:0,price:0,fees:0,amount:deb||(frais+taxe)||brut,devise:'XOF'});

function importCoris(txt){ txt=(txt||'').trim(); if(!txt)return {ok:false,msg:'Colle d\'abord ton relevé Coris.'};

  if(!Array.isArray(ops)) return {ok:false,msg:'⚠️ JSON invalide (attendu {ops:[…]} ou un tableau).'};
  pfEnsure();
  const norm=o=>({date:o.date||'',sgi:(o.sgi||'').trim(),type:OP_TYPES.includes(o.type)?o.type:'achat',titre:(o.titre||'').trim(),qty:+o.qty||0,price:+o.price||0,fees:+o.fees||0,amount:+o.amount||0,devise:(o.devise==='XOF'||o.devise==='FCFA')?'XOF':'EUR'});

  ops.forEach(o=>{ if(!o||typeof o!=='object')return; const v=norm(o),s=sig(v); if(seen.has(s)){dup++;return;} seen.add(s); state.pf.ops.push(Object.assign({id:newId()},v)); n++; });

  return {ok:true,msg:'✅ '+n+' opération(s) importée(s)'+(removed?' — '+removed+' remplacée(s)':'')+(dup?' — '+dup+' doublon(s) ignoré(s)':'')+'.'};

  if(DETAIL.level==='salary'){ const p=DETAIL.person; const tot=sumM(m=>Y().persons[p].salary[m]||0);
    head.innerHTML=`<div class="dhead"><button class="bk" onclick="closeDetail()">✕</button><h3>Salaire · ${esc(p)}</h3><span class="tot">${eur(tot)}<small style="display:block;font-size:11px;color:var(--muted);font-weight:600;text-align:right">/ an</small></span></div>`;
    let h=`<div class="note" style="margin:0 2px 8px">Salaire net de chaque mois. La virgule et une formule (ex. <b>=2600</b>) sont acceptées.</div><div class="card" style="margin:0">${m12rows(m=>Y().persons[p].salary[m]||0, "window.__sal")}</div>`;
    window.__sal=(m,v)=>setSalary(p,m,v); body.innerHTML=h;
  } else { const {person,kind,id}=DETAIL; const it=(Y().persons[person][kind]||[]).find(x=>x.id===id); if(!it){ closeDetail(); return; } const tot=sumM(m=>it.amounts[m]||0);
    head.innerHTML=`<div class="dhead"><button class="bk" onclick="closeDetail()">✕</button><h3>${esc(it.name)}</h3><span class="tot">${eur(tot)}<small style="display:block;font-size:11px;color:var(--muted);font-weight:600;text-align:right">/ an</small></span></div>`;
    let h=`<div class="mrow" style="border:none;padding-bottom:10px"><input class="nameedit" value="${esc(it.name)}" onchange="renameIncome('${jsq(person)}','${kind}','${id}',this.value)"><button class="delbtn" onclick="delIncome('${jsq(person)}','${kind}','${id}')">Supprimer</button></div><div class="note" style="margin:0 2px 8px">${kind==='extras'?'Entrée comptée dans le revenu (prorata).':'Revenu perso (hors prorata).'} Montant par mois :</div><div class="card" style="margin:0">${m12rows(m=>it.amounts[m]||0,"window.__inc")}</div>`;
    window.__inc=(m,v)=>setIncome(person,kind,id,m,v); body.innerHTML=h;
  }
}

function secSaisie(){
  setTitle('Saisie'); const m=MONTH; let h=monthSel();
  h+=`<div class="note" style="margin:2px 4px 10px">Pointe le <b>réel</b> de ${esc(MONTHS[m])} ligne par ligne. Touche le nom d'une ligne pour éditer les 12 mois en détail.</div>`;
  const block=(title,lines,kind,person)=>{ if(!lines.length)return''; let b=`<div class="sec"><h2>${esc(title)}</h2></div><div class="card">`;
    lines.forEach((l,i)=>{ const pv= kind==='foyer'?(l.planned[m]||0):catVal(person,l,m,'planned'); const rv=l.real[m]||0; const st=catStyle(l.group,i); const op=`openLine('${kind}','${l.id}',${person?`'${jsq(person)}'`:'null'},'${jsq(l.group)}')`;
      b+=`<div class="row"><div class="ic sm" style="background:${tint(st.color)};color:${st.color};cursor:pointer" onclick="${op}">${st.emoji}</div><div class="nm" style="cursor:pointer" onclick="${op}"><b>${esc(l.name)}</b><span>prévu ${eur(pv)}</span></div>`
        +(l.auto?`<div style="width:100px;text-align:right;font-weight:800;color:var(--muted)">${num(catVal(person,l,m,'real'))}</div>`:`<input class="medit" inputmode="decimal" placeholder="${pv?num(pv):'0'}" value="${rv?num(rv):''}" onchange="setCell('${kind}','${l.id}',${person?`'${jsq(person)}'`:'null'},${m},'real',this.value)">`)+`</div>`; });
    b+=`</div>`; return b; };
  h+=block('🏠 Foyer', Y().foyer, 'foyer', null);
  people.forEach(p=>h+=block('👤 '+p, (Y().persons[p].cats||[]), 'perso', p));
  return h;
}

const NAV=[{k:'accueil',i:'🏠',l:'Accueil',p:1},{k:'saisie',i:'✍️',l:'Saisie',p:1},{k:'budget',i:'🎯',l:'Budget',p:1},{k:'patrimoine',i:'🏦',l:'Patrimoine',p:1},{k:'invest',i:'📈',l:'Invest'},{k:'analyse',i:'📊',l:'Analyse'},{k:'revenus',i:'💰',l:'Revenus'},{k:'objectifs',i:'🎖️',l:'Objectifs'},{k:'exceptionnel',i:'💎',l:'Exceptionnel'},{k:'transferts',i:'🌍',l:'Transferts'}];
const SECT={accueil:secAccueil,saisie:secSaisie,analyse:secAnalyse,budget:secBudget,revenus:secRevenus,objectifs:secObjectifs,exceptionnel:secExceptionnel,transferts:secTransferts,invest:secInvest,patrimoine:secPatrimoine};
function setTitle(t){ const a=document.getElementById('title'); if(a)a.textContent=t; }
function kpi(k,v,cls){ return `<div class="kpi"><div class="k">${k}</div><div class="v ${cls||''}">${v}</div></div>`; }
function chgMonth(d){ MONTH=(MONTH+d+12)%12; render(); }
function setUI(k,v){ if(k==='amode')AMODE=v; else if(k==='bscope')BSCOPE=v; else if(k==='bper')BPER=v; else if(k==='cur')UICUR=v; else if(k==='mkt')UIMKT=v; else if(k==='isub')ISUB=v; else if(k==='ascope')ASCOPE=v; else if(k==='aper')APER=v; saveUI(); render(); }
function setTab(k){ TAB=k; saveUI(); closePlus(); render(); }
function openPlus(){ document.getElementById('plusSheet').classList.add('on'); }
function closePlus(){ document.getElementById('plusSheet').classList.remove('on'); }
function renderNav(){
  document.getElementById('sidenav').innerHTML=NAV.map(n=>`<button class="navi ${TAB===n.k?'on':''}" onclick="setTab('${n.k}')"><span class="ni">${n.i}</span>${n.l}</button>`).join('');
  const prim=NAV.filter(n=>n.p);
  document.getElementById('tabbar').innerHTML=prim.map(n=>`<button class="tab ${TAB===n.k?'on':''}" onclick="setTab('${n.k}')"><span class="ti">${n.i}</span>${n.l}</button>`).join('')+`<button class="tab ${NAV.some(n=>!n.p&&n.k===TAB)?'on':''}" onclick="openPlus()"><span class="ti">⋯</span>Plus</button>`;
  document.getElementById('plusList').innerHTML=NAV.filter(n=>!n.p).map(n=>`<div class="row clk" onclick="setTab('${n.k}')"><div class="ic" style="background:var(--accent-soft);color:var(--accent)">${n.i}</div><div class="nm"><b>${n.l}</b></div><div class="chev">›</div></div>`).join('');
}
function render(){
  const s=document.getElementById('scroll'); let h='';
  if(!people.length){ h=`<div class="card"><div class="note">Aucune donnée sur cet appareil. Ouvre d'abord l'appli complète pour saisir ton budget, puis reviens ici.</div></div>`; }
  else { const head=`<div class="deskhead"><h1>${(NAV.find(n=>n.k===TAB)||{}).l||''}</h1><div class="note">${esc(MONTHS[MONTH])} ${YEARK}</div></div>`; let body=''; try{ body=(SECT[TAB]||secAccueil)(); }catch(err){ console.error('render '+TAB, err); body=`<div class="card"><h2 style="margin:0 0 6px">⚠️ Souci d'affichage</h2><div class="note">L'onglet « ${esc((NAV.find(n=>n.k===TAB)||{}).l||TAB)} » a rencontré une erreur : <b>${esc((err&&err.message)||err)}</b>.<br>Fais-moi une capture. Tes données sont intactes (voir l'<span style="text-decoration:underline;cursor:pointer" onclick="location.href='/budget-famille/classic/'">ancienne appli</span>).</div></div>`; } h=head+body; }
  if(people.length && TAB!=='accueil' && TAB!=='analyse'){ h+=`<div class="banner">${LIVE?(TAB==='invest'?'✅ <b>Journal éditable</b> — onglet Journal : ajoute/modifie une opération, ou importe ton relevé Coris.':'✅ <b>Modifiable ici</b> — touche une ligne / un champ pour éditer.'):'Aperçu démo — sur ton appareil, tout est enregistré.'}</div>`; }
  s.innerHTML=`<div class="fade">${h}</div>`; s.scrollTop=0; renderNav(); if(TAB==='invest'&&PFQ)pfFilterInvest(PFQ);
}
function toggleTheme(){ const cur=document.documentElement.getAttribute('data-theme'); const dark=matchMedia('(prefers-color-scheme: dark)').matches; const next=cur==='dark'?'light':cur==='light'?'dark':(dark?'light':'dark'); document.documentElement.setAttribute('data-theme',next); }
function openYearSheet(){ DETAIL={level:'year'}; showDetail(); }
function switchYear(y){ if(state.years[y]!=null){ YEARK=+y; MONTH=(+y===new Date().getFullYear())?new Date().getMonth():0; } closeDetail(); }
function createYear(y){ y=+y; if(!state.years[y]){ const src=JSON.parse(JSON.stringify(Y())); (src.foyer||[]).forEach(l=>{ l.real=Array(12).fill(0); }); Object.keys(src.persons||{}).forEach(p=>{ (src.persons[p].cats||[]).forEach(l=>{ l.real=Array(12).fill(0); }); }); src.exceptional=[]; src.transfers=[]; state.years[y]=src; save(); } YEARK=y; MONTH=(y===new Date().getFullYear())?new Date().getMonth():0; closeDetail(); }
function renderYearDetail(){ const head=document.getElementById('detailHead'),body=document.getElementById('detailBody'); const ys=Object.keys(state.years).map(Number).sort((a,b)=>a-b); const minY=Math.min(...ys),maxY=Math.max(...ys);
  head.innerHTML=`<div class="dhead"><button class="bk" onclick="closeDetail()">✕</button><h3>📅 Années</h3></div>`;
  let h='<div class="card" style="margin:0">'; ys.forEach(y=>{ const on=y===+YEARK; h+=`<div class="row clk" onclick="switchYear(${y})"><div class="ic" style="background:${on?'var(--accent)':'var(--accent-soft)'};color:${on?'#fff':'var(--accent)'}">📅</div><div class="nm"><b>${y}</b><span>${on?'année en cours':'toucher pour ouvrir'}</span></div><div class="chev">›</div></div>`; }); h+='</div>';
  h+=`<div class="row" style="gap:8px;padding:10px 0"><button class="editbtn" onclick="createYear(${minY-1})">＋ Créer ${minY-1}</button><button class="editbtn" onclick="createYear(${maxY+1})">＋ Créer ${maxY+1}</button></div><div class="note" style="text-align:center">Une nouvelle année reprend ton <b>budget prévu</b> (le réel repart à zéro ; exceptionnel & transferts vides). Le portefeuille bourse est commun à toutes les années.</div>`;
  body.innerHTML=h;
}
['themeBtn','themeBtn2'].forEach(id=>{const e=document.getElementById(id);if(e)e.onclick=toggleTheme;});
['yearBtn','yearBtn2'].forEach(id=>{const e=document.getElementById(id);if(e)e.onclick=openYearSheet;});
document.getElementById('plusSheet').addEventListener('click',e=>{ if(e.target.id==='plusSheet')closePlus(); });
document.getElementById('detailSheet').addEventListener('click',e=>{ if(e.target.id==='detailSheet')closeDetail(); });
function pfFilterInvest(q){ q=(q||'').toLowerCase().trim(); document.querySelectorAll('[data-invrow]').forEach(el=>{ const t=(el.getAttribute('data-invrow')||'').toLowerCase(); el.style.display=(!q||t.indexOf(q)>=0)?'':'none'; }); }
document.addEventListener('input',e=>{ if(e.target&&e.target.id==='pfsearch'){ PFQ=e.target.value; pfFilterInvest(PFQ); } });
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
