.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.card.tight{padding:13px}

.monthsel .m{font-weight:800;font-size:16px}
.chip{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.seg{display:flex;background:var(--card);border-radius:999px;box-shadow:var(--shadow-sm);padding:5px;gap:4px;margin:10px 0;overflow-x:auto}
.seg button{flex:1;min-width:max-content;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:9px 14px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(108,92,231,.35)}
.seg.sub button.on{background:var(--accent-soft);color:var(--accent);box-shadow:none}

.fade{animation:fade .26s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

svg{display:block}
.chartbars{display:flex;align-items:flex-end;gap:5px;height:120px;padding:4px 0}

.chartbars .cb i{width:70%;max-width:22px;border-radius:6px 6px 3px 3px;display:block}
.chartbars .cb small{font-size:9px;color:var(--faint)}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
.deskhead{display:none}
@media (min-width:900px){
  .sidebar{display:flex}
  .tabbar{display:none}
  .app{background:var(--bg2)}
  .scroll{padding:12px 30px 44px}
  .top{display:none}
  .kgrid{grid-template-columns:repeat(4,1fr)}
  .grid2{grid-template-columns:1fr 1fr}
  .deskhead{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 2px}
  .deskhead h1{font-size:26px;font-weight:850;margin:0;letter-spacing:-.5px}
}
</style>

function epargne(p,m,f){ return personFullIncome(p,m)-persoTotal(p,m,f)-communeShare(p,m,f); }
function realizedMonth(m){ if(foyerTotal(m,'real')>0)return true; return people.some(p=>(Y().persons[p].cats||[]).some(l=>!l.auto&&(l.real[m]||0)>0)); }
function fOf(m){ return realizedMonth(m)?'real':'planned'; }
function isSaving(g){ return /épargne|epargne|investiss/i.test(g||''); }
function commonSaving(m,f){ return Y().foyer.filter(l=>isSaving(l.group)).reduce((s,l)=>s+(l[f][m]||0),0); }
function epargneProj(p,m){ return realizedMonth(m)? epargne(p,m,'real') : epargne(p,m,'planned'); }
function personSaving(p){ let s=0; for(let m=0;m<12;m++) s+=epargneProj(p,m)+prorata(p,m)*(realizedMonth(m)?commonSaving(m,'real'):commonSaving(m,'planned')); return s; }
function coupleSaving(){ let s=0; for(let m=0;m<12;m++){ people.forEach(p=>s+=epargneProj(p,m)); s+=(realizedMonth(m)?commonSaving(m,'real'):commonSaving(m,'planned')); } return s; }
function sumM(fn){ let s=0; for(let m=0;m<12;m++)s+=fn(m); return s; }
const EXC={revenu:{cash:1,lbl:'Revenu exceptionnel'},remb:{cash:1,lbl:'Remboursement'},conso:{cash:-1,lbl:'Conso exceptionnelle'},don:{cash:-1,lbl:'Don'}};
function excList(){ return (Y().exceptional)||[]; }
function excNat(k){ return EXC[k]||{cash:-1,lbl:k}; }
function transList(){ return (Y().transfers)||[]; }
function trFee(t){ return t.feeMode==='pct'? (t.eur||0)*(t.fees||0)/100 : (t.fees||0); }

function num(n){ n=Number(n)||0; const neg=n<0; n=Math.abs(n); let s; if(n<50){ const r=Math.round(n*10)/10; s=(Number.isInteger(r)?String(r):r.toFixed(1)).replace('.',','); } else s=Math.round(n).toLocaleString('fr-FR'); return (neg?'-':'')+s; }
function eur(n){ return num(n)+' €'; }
function pctI(x){ return Math.round(x*100)+' %'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function qtyFmt(n){ n=+n||0; if(n===0)return'0'; const a=Math.abs(n); if(a<1)return n.toFixed(6).replace(/0+$/,'').replace('.',','); if(a<1000&&!Number.isInteger(n))return n.toFixed(2).replace('.',','); return Math.round(n).toLocaleString('fr-FR'); }

const PAL=['#3b82f6','#f97316','#8b5cf6','#14b8a6','#ec4899','#f59e0b','#a855f7','#22c55e','#6366f1','#ef4444','#06b6d4','#84cc16','#eab308','#f472b6','#0ea5e9','#fb7185'];
const ICONMAP={'loyer':'🏠','charge':'🏠','électri':'💡','electri':'💡','eau':'💧','assur':'🛡️','course':'🛒','aliment':'🛒','narwal':'🧽','abonnement':'📱','box':'📶','internet':'📶','audible':'🎧','netflix':'🎬','prime':'📦','youtube':'▶️','cloud':'☁️','apple':'☁️','voiture':'🚗','parking':'🅿️','transport':'🚆','déplac':'🚗','deplac':'🚗','santé':'🩺','sante':'🩺','médic':'🩺','banc':'🏦','imprévu':'⚡','imprevu':'⚡','variable':'⚡','déménag':'📦','demenag':'📦','loisir':'🎉','sortie':'🍹','resto':'🍽️','vacance':'✈️','noël':'🎄','noel':'🎄','cadeau':'🎁','mariage':'💍','péage':'🛣️','peage':'🛣️','épargne':'🐷','epargne':'🐷','projet':'🎯','sécurité':'🛟','securite':'🛟','invest':'📈','dîme':'⛪','dime':'⛪','obligatoire':'📌','sport':'🏋️','vêtement':'👕','vetement':'👕','coiffure':'💇','soin':'💆','salaire':'💰','autre':'➕','perso':'👛','bitcoin':'₿','ethereum':'Ξ'};
function catStyle(name,i){ const t=(name||'').toLowerCase(); let e='💠'; for(const k in ICONMAP){ if(t.includes(k)){ e=ICONMAP[k]; break; } } let h=0; for(const c of t)h=(h*31+c.charCodeAt(0))>>>0; return {emoji:e,color:PAL[(i!=null?i:h)%PAL.length]}; }
function tint(hex){ return hex+'22'; }

function donut(slices,big,sub){
  const total=slices.reduce((s,x)=>s+Math.max(0,x.value),0)||1; const R=54,C=2*Math.PI*R; let off=0;
  const rings=slices.filter(s=>s.value>0).map(s=>{ const len=s.value/total*C; const seg=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`; off+=len; return seg; }).join('');
  return `<div class="donutwrap"><svg width="172" height="172" viewBox="0 0 140 140">${rings}<text x="70" y="66" text-anchor="middle" fill="var(--ink)" style="font:850 19px -apple-system">${esc(big)}</text><text x="70" y="86" text-anchor="middle" fill="var(--muted)" style="font:600 11px -apple-system">${esc(sub)}</text></svg></div>`;
}
function progress(pct,color){ const w=Math.max(0,Math.min(100,pct*100)); return `<div class="bar"><i style="width:${w}%;background:${color||'var(--accent)'}"></i></div>`; }
function barChart(vals,labels,color){ const max=Math.max(1,...vals.map(v=>Math.abs(v))); return `<div class="chartbars">${vals.map((v,i)=>`<div class="cb" title="${esc(labels[i])} : ${eur(v)}"><i style="height:${Math.max(2,Math.abs(v)/max*104)}px;background:${v<0?'var(--red)':(color||'var(--accent)')}"></i><small>${esc((labels[i]||'')[0]||'')}</small></div>`).join('')}</div>`; }
function lineChart(vals,labels){
  const W=320,H=110,pad=6; const min=Math.min(0,...vals),max=Math.max(1,...vals),rng=(max-min)||1;
  const pts=vals.map((v,i)=>[pad+i*(W-2*pad)/Math.max(1,vals.length-1), H-pad-(v-min)/rng*(H-2*pad)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L ${pts[pts.length-1][0].toFixed(1)} ${H-pad} L ${pts[0][0].toFixed(1)} ${H-pad} Z`;
  const zero=H-pad-(0-min)/rng*(H-2*pad);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none"><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--line)" stroke-width="1"/><path d="${area}" fill="url(#lg)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function catRow(name,amount,subtitle,i,opts){ opts=opts||{}; const st=opts.style||catStyle(name,i);
  return `<div class="row ${opts.onclick?'clk':''}" ${opts.onclick?`onclick="${opts.onclick}"`:''}>
    <div class="ic ${opts.sm?'sm':''}" style="background:${tint(st.color)};color:${st.color}">${opts.avatar||st.emoji}</div>
    <div class="nm"><b>${esc(name)}</b><span>${esc(subtitle||'')}</span></div>
    <div class="amt">${opts.amtHtml||eur(amount)}${opts.amtSub?`<small>${esc(opts.amtSub)}</small>`:''}</div>${opts.onclick?'<div class="chev">›</div>':''}</div>`;
}

function pfMarket(sgi){ const s=(sgi||'').toLowerCase(); if(/coris|brvm/.test(s))return'BRVM'; if(/binance|okx|crypto|bitcoin|ether|coin|btc|eth/.test(s))return'Crypto'; if(/fortuneo|euronext|bourso|pea/.test(s))return'Euronext'; return'Autre'; }
function eurOf(v,dev){ return dev==='XOF'? v*FX() : v; }
function dispEur(v){ return UICUR==='XOF'? v/FX() : v; }
function money(vEur,signed){ const x=dispEur(vEur); const s=UICUR==='XOF'? Math.round(x).toLocaleString('fr-FR')+' FCFA' : num(x)+' €'; return (signed&&vEur>0?'+':'')+s; }
function hasPf(){ return state.pf&&state.pf.ops&&state.pf.ops.length; }
function pfPositions(){ const pos={}; (state.pf.ops||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(o=>{ if(o.type!=='achat'&&o.type!=='vente')return; const k=(o.sgi||'?')+'|'+(o.titre||'?'); if(!pos[k])pos[k]={sgi:o.sgi,titre:o.titre,dev:o.devise||'EUR',qty:0,cost:0}; const P=pos[k],q=+o.qty||0,pr=+o.price||0,fr=+o.fees||0; if(o.type==='achat'){P.qty+=q;P.cost+=q*pr+fr;}else{const cmp=P.qty?P.cost/P.qty:0;P.cost-=cmp*Math.min(q,P.qty);P.qty-=q;if(P.qty<1e-6){P.qty=0;P.cost=0;}} });
  return Object.values(pos).filter(p=>p.qty>1e-6).map(p=>{ const cmp=p.qty?p.cost/p.qty:0,key=p.sgi+'|'+p.titre; const price=(state.pf.prices&&state.pf.prices[key]!=null&&state.pf.prices[key]!=='')?+state.pf.prices[key]:cmp; const val=p.qty*price; return {sgi:p.sgi,titre:p.titre,dev:p.dev,qty:p.qty,cmp,price,val,pv:val-p.qty*cmp,vp:cmp?(price-cmp)/cmp:0,key}; }).sort((a,b)=>eurOf(b.val,b.dev)-eurOf(a.val,a.dev)); }
function pfCash(){ const c={}; (state.pf.ops||[]).forEach(o=>{ const dev=o.devise||'EUR',sgi=o.sgi||'?'; if(!c[sgi])c[sgi]={dev,amt:0}; const x=c[sgi]; if(o.type==='depot'||o.type==='dividende')x.amt+=(+o.amount||0); else if(o.type==='retrait'||o.type==='frais')x.amt-=(+o.amount||0); else if(o.type==='achat')x.amt-=((+o.qty||0)*(+o.price||0)+(+o.fees||0)); else if(o.type==='vente')x.amt+=((+o.qty||0)*(+o.price||0)-(+o.fees||0)); }); return c; }
function pfRealized(mkt){ const run={}; let realized=0; (state.pf.ops||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(o=>{ if(mkt&&mkt!=='all'&&pfMarket(o.sgi)!==mkt)return; const dev=o.devise||'EUR'; const k=(o.sgi||'?')+'|'+(o.titre||'?'); if(o.type==='achat'){ const p=run[k]||(run[k]={qty:0,cost:0}); p.qty+=(+o.qty||0); p.cost+=(+o.qty||0)*(+o.price||0)+(+o.fees||0);} else if(o.type==='vente'){ const p=run[k]||(run[k]={qty:0,cost:0}); const cmp=p.qty?p.cost/p.qty:0; const q=+o.qty||0; realized+=eurOf(q*(+o.price||0)-(+o.fees||0)-cmp*q,dev); p.cost-=cmp*Math.min(q,p.qty); p.qty-=q; if(p.qty<1e-6){p.qty=0;p.cost=0;} } }); return realized; }

function monthSel(){ return `<div class="monthsel"><button class="chip" onclick="chgMonth(-1)">‹</button><div class="m">${esc(MONTHS[MONTH])} ${YEARK}</div><button class="chip" onclick="chgMonth(1)">›</button></div>`; }

function secAccueil(){
  setTitle('Accueil');
  const m=MONTH,f=fOf(m);
  const rev=people.reduce((s,p)=>s+personFullIncome(p,m),0);
  const dep=foyerTotal(m,f)+people.reduce((s,p)=>s+persoTotal(p,m,f),0);
  const net=rev-dep;
  let h=monthSel();
  h+=`<div class="card"><div class="hero"><div class="lbl">Épargne du mois · ${esc(MONTHS[m])}</div><div class="big ${net>=0?'pos':'neg'}">${net>=0?'+':''}${eur(net)}</div><div class="sub">${eur(rev)} de revenus · ${eur(dep)} de dépenses</div></div></div>`;
  const savY=coupleSaving(); const pfNet = hasPf()? (pfPositions().reduce((s,p)=>s+eurOf(p.val,p.dev),0)+Object.values(pfCash()).reduce((s,c)=>s+eurOf(c.amt,c.dev),0)) : 0;
  h+=`<div class="kgrid">${kpi('💰 Revenus couple',eur(rev))}${kpi('💸 Dépenses',eur(dep))}${kpi('🐷 Épargne / mois',eur(net),net>=0?'pos':'neg')}${kpi('📊 Taux d\'épargne',rev>0?pctI(net/rev):'—')}${kpi('🎯 Épargne projetée '+YEARK,eur(savY),savY>=0?'pos':'neg')}${hasPf()?kpi('💼 Portefeuille',eur(pfNet)):kpi('🏦 Solde départ',eur(state.startCash||0))}</div>`;
  const closed=[]; for(let mm=0;mm<12;mm++) if(realizedMonth(mm)) closed.push(mm);
  if(closed.length){ const revD=closed.reduce((s,mm)=>s+people.reduce((a,p)=>a+personFullIncome(p,mm),0),0); const depD=closed.reduce((s,mm)=>s+foyerTotal(mm,'real')+people.reduce((a,p)=>a+persoTotal(p,mm,'real'),0),0);
    h+=`<div class="sec"><h2>Depuis janvier · ${closed.length} mois saisis</h2></div><div class="card"><div class="grid2"><div class="kpi"><div class="k">Revenus à date</div><div class="v pos">${eur(revD)}</div></div><div class="kpi"><div class="k">Dépenses à date</div><div class="v">${eur(depD)}</div></div></div><div class="barlbl" style="margin-top:12px"><b>Épargne réelle cumulée</b><span class="pill ${revD-depD>=0?'g':'r'}">${eur(revD-depD)}</span></div></div>`; }
  const alerts=[]; if(realizedMonth(m)){ foyerGroups().forEach(g=>{ const pl=foyerGroupTotal(g,m,'planned'),re=foyerGroupTotal(g,m,'real'); if(pl>0&&re>pl*1.05) alerts.push({n:g,pl,re}); }); }
  if(alerts.length){ h+=`<div class="sec"><h2>⚠️ À surveiller ce mois</h2></div><div class="card">`; alerts.slice(0,5).forEach((a,i)=>h+=catRow(a.n,a.re,'prévu '+eur(a.pl),i,{amtSub:'+'+eur(a.re-a.pl)})); h+=`</div>`; }
  const cols=['#6c5ce7','#14b8a6','#f59e0b','#ec4899'];
  h+=`<div class="sec"><h2>Répartition du couple</h2></div><div class="card"><div class="pbar">${people.map((p,i)=>`<i style="width:${(prorata(p,m)*100).toFixed(1)}%;background:${cols[i%4]}"></i>`).join('')}</div><div class="plegend">${people.map((p,i)=>`<div class="li"><span class="dot" style="background:${cols[i%4]}"></span><b style="color:var(--ink)">${esc(p)}</b> ${pctI(prorata(p,m))}</div>`).join('')}</div></div>`;
  return h;
}

function secAnalyse(){
  setTitle('Analyse');
  const m=MONTH,f=fOf(m);
  let h=monthSel()+`<div class="seg"><button class="${AMODE==='entrees'?'on':''}" onclick="setUI('amode','entrees')">Entrées</button><button class="${AMODE==='sorties'?'on':''}" onclick="setUI('amode','sorties')">Sorties</button></div>`;
  let items=[],total=0,center;
  if(AMODE==='entrees'){ let sal=people.reduce((s,p)=>s+(Y().persons[p].salary[m]||0),0); if(sal>0)items.push({name:'Salaires',amount:sal}); people.forEach(p=>{ (Y().persons[p].extras||[]).forEach(e=>{const v=e.amounts[m]||0;if(v>0)items.push({name:(e.name||'Autre entrée')+' · '+p,amount:v});}); (Y().persons[p].persoExtras||[]).forEach(e=>{const v=e.amounts[m]||0;if(v>0)items.push({name:(e.name||'Revenu perso')+' · '+p,amount:v});}); }); total=items.reduce((s,x)=>s+x.amount,0); center='Revenus';
  } else { foyerGroups().forEach(g=>{const v=foyerGroupTotal(g,m,f);if(v>0)items.push({name:g,amount:v});}); people.forEach(p=>{persoGroups(p).forEach(g=>{const v=persoGroupTotal(p,g,m,f);if(v>0)items.push({name:g+' · '+p,amount:v});});}); total=items.reduce((s,x)=>s+x.amount,0); center='Dépenses'; }
  items.sort((a,b)=>b.amount-a.amount); items.forEach((it,i)=>it.style=catStyle(it.name,i));
  const slices=items.map((it,i)=>({value:it.amount,color:AMODE==='entrees'?['#22c55e','#16a34a','#4ade80','#86efac','#34d399','#10b981'][i%6]:it.style.color}));
  h+=`<div class="card">${donut(slices.length?slices:[{value:1,color:'var(--line)'}],eur(total),center)}<div class="note" style="text-align:center">${realizedMonth(m)?'Réel saisi':'Prévu'} · ${esc(MONTHS[m])} ${YEARK}</div></div>`;
  if(AMODE==='sorties'){ const rev=people.reduce((s,p)=>s+personFullIncome(p,m),0),ratio=rev>0?total/rev:0; h+=`<div class="card tight"><div class="barlbl"><b>💸 Dépenses / Revenus</b><span style="font-weight:800;color:${ratio>1?'var(--red)':'var(--green-ink)'}">${pctI(ratio)}</span></div><div class="note">${eur(total)} sur ${eur(rev)}</div>${progress(ratio,ratio>1?'var(--red)':'var(--accent)')}</div>`; }
  h+=`<div class="card">`; if(!items.length)h+=`<div class="note" style="text-align:center;padding:14px">Aucune ${AMODE==='entrees'?'entrée':'sortie'}.</div>`;
  items.forEach((it,i)=>h+=catRow(it.name,it.amount,pctI(total>0?it.amount/total:0)+' du total',i,{style:it.style})); h+=`</div>`;

function secBudget(){
  setTitle('Budget');
  const scopes=['Foyer',...people];
  let h=`<div class="seg">${scopes.map(s=>`<button class="${BSCOPE===s?'on':''}" onclick="setUI('bscope','${esc(s)}')">${esc(s)}</button>`).join('')}</div>`;
  h+=`<div class="seg sub"><button class="${BPER==='mois'?'on':''}" onclick="setUI('bper','mois')">Mois</button><button class="${BPER==='annee'?'on':''}" onclick="setUI('bper','annee')">Année ${YEARK}</button></div>`;
  if(BPER==='mois')h+=monthSel();
  const per=BPER==='mois', P=(fn)=>per?fn(MONTH):sumM(fn);
  if(BSCOPE==='Foyer'){
    const plan=P(m=>foyerTotal(m,'planned')),real=P(m=>foyerTotal(m,'real'));
    h+=budgetHeader('Dépenses du foyer',per?foyerTotal(MONTH,fOf(MONTH)):plan,plan,real,per);
    const gs=foyerGroups().map((g,i)=>({g,i,plan:P(m=>foyerGroupTotal(g,m,'planned')),real:P(m=>foyerGroupTotal(g,m,'real'))})).filter(x=>x.plan||x.real).sort((a,b)=>b.plan-a.plan);
    h+=`<div class="card">`; gs.forEach(x=>{ const shown=per?foyerGroupTotal(x.g,MONTH,fOf(MONTH)):x.plan; const st=catStyle(x.g,x.i); h+=catRow(x.g,shown, x.real>0?`réel ${eur(x.real)} · prévu ${eur(x.plan)}`:'prévu',x.i,{style:st}); const r=x.plan>0?x.real/x.plan:0; h+=`<div style="padding:0 2px 10px 57px;margin-top:-4px">${progress(x.real>0?r:0,r>1.02?'var(--red)':st.color)}</div>`; }); h+=`</div>`;
    h+=`<div class="sec"><h2>Qui paie quoi (prorata)</h2></div><div class="card">`;
    people.forEach((p,i)=>{ const sh=per?communeShare(p,MONTH,fOf(MONTH)):sumM(m=>prorata(p,m)*foyerTotal(m,'planned')); const st=catStyle(p,i+2); h+=`<div class="subline"><div class="ic sm" style="background:${tint(st.color)};color:${st.color}">${esc(p[0])}</div><span class="sn">${esc(p)}${per?' · '+pctI(prorata(p,MONTH)):''}</span><span class="sv">${eur(sh)}</span></div>`; }); h+=`</div>`;
  } else {
    const p=BSCOPE; const inc=P(m=>personFullIncome(p,m)); const perso=P(m=>persoTotal(p,m,per?fOf(MONTH):'planned')); const foy=per?communeShare(p,MONTH,fOf(MONTH)):sumM(m=>prorata(p,m)*foyerTotal(m,'planned')); const ep=inc-perso-foy;
    h+=`<div class="card"><div class="hero" style="padding:16px 8px 10px"><div class="lbl">Épargne ${esc(p)} · ${per?esc(MONTHS[MONTH]):'année'}</div><div class="big ${ep>=0?'pos':'neg'}" style="font-size:34px">${ep>=0?'+':''}${eur(ep)}</div><div class="sub">Revenu ${eur(inc)}</div></div><div class="grid2">${kpi('🏠 Part foyer',eur(foy))}${kpi('👛 Dépenses perso',eur(perso))}</div></div>`;
    const gs=persoGroups(p).map((g,i)=>({g,i,v:P(m=>persoGroupTotal(p,g,m,per?fOf(MONTH):'planned'))})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
    if(gs.length){ h+=`<div class="sec"><h2>Dépenses perso de ${esc(p)}</h2></div><div class="card">`; gs.forEach(x=>h+=catRow(x.g,x.v,pctI(perso>0?x.v/perso:0)+' du perso',x.i)); h+=`</div>`; } else h+=`<div class="card"><div class="note" style="text-align:center;padding:12px">Aucune dépense perso.</div></div>`;
  }
  return h;
}
function budgetHeader(lbl,shown,plan,real,per){ const r=plan>0?real/plan:0; return `<div class="card"><div class="barlbl"><b>${esc(lbl)}</b><span style="font-weight:800">${eur(shown)}</span></div>${real>0?`<div class="note">Réel ${eur(real)} / prévu ${eur(plan)}</div>${progress(r,r>1.02?'var(--red)':'var(--accent)')}<div class="barlbl" style="margin-top:5px"><span class="note">${pctI(r)} consommé</span><span class="pill ${r>1.02?'r':'g'}">${real<=plan?'dans le budget':'dépassé'}</span></div>`:`<div class="note">Budget prévu — aucun réel saisi ${per?'ce mois':'cette année'}.</div>`}</div>`; }

function secRevenus(){
  setTitle('Revenus');
  const cols=['#6c5ce7','#14b8a6','#f59e0b','#ec4899'];
  const monthly=MSHORT.map((_,m)=>incomeTotal(m)+people.reduce((s,p)=>s+personPersoIncome(p,m),0));
  let h=`<div class="card"><div class="barlbl"><b>Revenus du couple ${YEARK}</b><span style="font-weight:800">${eur(monthly.reduce((s,v)=>s+v,0))}</span></div>${barChart(monthly,MSHORT)}<div class="note" style="text-align:center">Total mensuel (salaires + entrées + revenus perso)</div></div>`;
  people.forEach((p,i)=>{ const sal=sumM(m=>Y().persons[p].salary[m]||0); const ex=sumM(m=>((Y().persons[p].extras||[]).reduce((a,e)=>a+(e.amounts[m]||0),0))); const pex=sumM(m=>personPersoIncome(p,m)); const tot=sal+ex+pex;
    h+=`<div class="sec"><h2>${esc(p)}</h2><span class="note">${eur(tot)} / an</span></div><div class="card">`;
    h+=catRow('Salaires',sal,'sur 12 mois',0,{avatar:'💰',style:{emoji:'💰',color:'#22c55e'}});
    if(ex>0){ (Y().persons[p].extras||[]).forEach((e,j)=>{ const v=sumM(m=>e.amounts[m]||0); if(v>0)h+=catRow(e.name||'Autre entrée',v,'entrée exceptionnelle',j+1,{avatar:'✨',style:{emoji:'✨',color:'#f59e0b'}}); }); }
    if(pex>0){ (Y().persons[p].persoExtras||[]).forEach((e,j)=>{ const v=sumM(m=>e.amounts[m]||0); if(v>0)h+=catRow(e.name||'Revenu perso',v,'hors prorata',j+5,{avatar:'👛',style:{emoji:'👛',color:'#14b8a6'}}); }); }
    h+=`</div>`; });
  h+=`<div class="sec"><h2>Prorata moyen ${YEARK}</h2></div><div class="card"><div class="pbar">`;
  const totInc=people.map(p=>sumM(m=>personIncome(p,m))); const gt=totInc.reduce((s,v)=>s+v,0)||1;
  h+=people.map((p,i)=>`<i style="width:${(totInc[i]/gt*100).toFixed(1)}%;background:${cols[i%4]}"></i>`).join('')+`</div><div class="plegend">${people.map((p,i)=>`<div class="li"><span class="dot" style="background:${cols[i%4]}"></span><b style="color:var(--ink)">${esc(p)}</b> ${pctI(totInc[i]/gt)}</div>`).join('')}</div></div>`;
  return h;
}

function secObjectifs(){
  setTitle('Objectifs');
  const savY=coupleSaving();
  let h=`<div class="card"><div class="hero"><div class="lbl">Épargne projetée ${YEARK}</div><div class="big ${savY>=0?'pos':'neg'}">${savY>=0?'+':''}${eur(savY)}</div><div class="sub">soit ${eur(savY/12)} / mois en moyenne</div></div></div>`;
  let bal=state.startCash||0; const cum=MSHORT.map((_,m)=>{ people.forEach(p=>bal+=epargneProj(p,m)); bal+=(realizedMonth(m)?commonSaving(m,'real'):commonSaving(m,'planned')); return Math.round(bal); });
  h+=`<div class="card"><div class="barlbl"><b>Trésorerie cumulée</b><span style="font-weight:800">${eur(cum[11])}</span></div>${lineChart(cum,MSHORT)}<div class="note" style="text-align:center">Solde de départ ${eur(state.startCash||0)} + épargne cumulée mois par mois</div></div>`;
  h+=`<div class="sec"><h2>Par personne</h2></div>`;
  people.forEach((p,i)=>{ const sav=personSaving(p); const obj=(Y().persons[p].epargneObjectif||0)*12; const st=catStyle(p,i); const r=obj>0?sav/obj:0;
    h+=`<div class="card tight"><div class="row"><div class="ic" style="background:${tint(st.color)};color:${st.color}">${esc(p[0])}</div><div class="nm"><b>${esc(p)}</b><span>${obj>0?'Objectif '+eur(obj)+' / an':'Aucun objectif fixé'}</span></div><div class="amt ${sav>=0?'pos':'neg'}">${sav>=0?'+':''}${eur(sav)}</div></div>${obj>0?progress(r,r>=1?'var(--green)':'var(--accent)')+`<div class="barlbl" style="margin-top:5px"><span class="note">${pctI(r)} de l'objectif</span><span class="pill ${r>=1?'g':'n'}">${r>=1?'atteint 🎉':'en cours'}</span></div>`:''}</div>`; });
  return h;
}

function secExceptionnel(){
  setTitle('Exceptionnel');
  const list=excList();
  const tE=list.filter(e=>excNat(e.nature).cash>0).reduce((s,e)=>s+(e.montant||0),0), tS=list.filter(e=>excNat(e.nature).cash<0).reduce((s,e)=>s+(e.montant||0),0);
  let h=`<div class="grid2"><div class="kpi"><div class="k">➕ Entrées exceptionnelles</div><div class="v pos">${eur(tE)}</div></div><div class="kpi"><div class="k">➖ Sorties exceptionnelles</div><div class="v neg">${eur(tS)}</div></div></div>`;
  if(!list.length){ h+=`<div class="card"><div class="note" style="text-align:center;padding:16px">Aucun événement exceptionnel enregistré.</div></div>`; return h; }
  h+=`<div class="sec"><h2>Événements ${YEARK}</h2></div><div class="card">`;
  list.slice().sort((a,b)=>(a.month||0)-(b.month||0)).forEach((e,i)=>{ const nat=excNat(e.nature); h+=catRow(e.libelle||e.name||nat.lbl, e.montant||0, nat.lbl+' · '+MONTHS[e.month||0], i, {avatar:nat.cash>0?'💎':'💥',amtHtml:`<span class="${nat.cash>0?'pos':'neg'}">${nat.cash>0?'+':'-'}${eur(e.montant||0)}</span>`}); }); h+=`</div>`;
  return h;
}

function secTransferts(){
  setTitle('Transferts');
  const list=transList();
  let tEur=0,tFees=0,tFcfa=0; list.forEach(t=>{tEur+=t.eur||0;tFees+=trFee(t);tFcfa+=t.fcfa||0;});
  let h=`<div class="grid2"><div class="kpi"><div class="k">💶 Total envoyé</div><div class="v">${eur(tEur+tFees)}</div></div><div class="kpi"><div class="k">🌍 Reçu (FCFA)</div><div class="v">${Math.round(tFcfa).toLocaleString('fr-FR')}</div></div></div>`;
  if(!list.length){ h+=`<div class="card"><div class="note" style="text-align:center;padding:16px">Aucun transfert enregistré.</div></div>`; return h; }
  h+=`<div class="card tight"><div class="note">Frais totaux : <b>${eur(tFees)}</b> · Taux moyen : <b>1 € = ${tEur?Math.round(tFcfa/tEur).toLocaleString('fr-FR'):'—'} FCFA</b></div></div>`;
  h+=`<div class="sec"><h2>${list.length} envoi(s)</h2></div><div class="card">`;
  list.slice().reverse().forEach((t,i)=>{ const cost=(t.eur||0)+trFee(t); const prov=t.provider||'Transfert'; h+=catRow(t.beneficiary||prov, cost, prov+(t.motif?' · '+t.motif:'')+(t.date?' · '+t.date:''), i, {avatar:'💸',amtHtml:eur(cost), amtSub:Math.round(t.fcfa||0).toLocaleString('fr-FR')+' FCFA'}); }); h+=`</div>`;
  return h;
}

function secInvest(){
  setTitle('Investissements');
  if(!hasPf()){ let h=`<div class="card"><div class="hero"><div class="lbl">Portefeuille</div><div class="big">—</div><div class="sub">Aucune opération dans cet aperçu.</div></div></div><div class="banner">Ouvre l'appli complète pour gérer BRVM · Euronext · crypto. <span style="text-decoration:underline;cursor:pointer" onclick="location.href='/budget-famille/classic/'">Ouvrir ›</span></div>`; return h; }
  const mkts=['all','Euronext','BRVM','Crypto']; const inMkt=sgi=>UIMKT==='all'||pfMarket(sgi)===UIMKT;
  let h=`<div class="seg" style="margin-bottom:6px">${mkts.map(k=>`<button class="${UIMKT===k?'on':''}" onclick="setUI('mkt','${k}')">${k==='all'?'Tout':k}</button>`).join('')}</div>`;
  h+=`<div class="seg sub"><button class="${UICUR==='EUR'?'on':''}" onclick="setUI('cur','EUR')">€ Euro</button><button class="${UICUR==='XOF'?'on':''}" onclick="setUI('cur','XOF')">FCFA</button></div>`;
  const pos=pfPositions().filter(p=>inMkt(p.sgi)); const cash=pfCash();
  let valE=0,invE=0; pos.forEach(p=>{valE+=eurOf(p.val,p.dev);invE+=eurOf(p.qty*p.cmp,p.dev);}); const pvE=valE-invE;
  let cashE=0; Object.keys(cash).forEach(sgi=>{ if(inMkt(sgi)) cashE+=eurOf(cash[sgi].amt,cash[sgi].dev); });
  const realE=pfRealized(UIMKT);
  h+=`<div class="card"><div class="hero" style="padding:18px 8px 10px"><div class="lbl">Total ${UIMKT==='all'?'portefeuille':UIMKT}</div><div class="big">${money(valE+cashE)}</div><div class="sub ${pvE>=0?'pos':'neg'}">${money(pvE,true)} de +/- value latente${invE?` · ${pctI(pvE/invE)}`:''}</div></div><div class="kgrid">${kpi('📈 Titres',money(valE))}${kpi('💵 Espèces',money(cashE))}${kpi('💰 +/- value réalisée',money(realE,true),realE>=0?'pos':'neg')}${kpi('🧮 Investi',money(invE))}</div></div>`;
  if(pos.length){ const slices=pos.map((p,i)=>({value:eurOf(p.val,p.dev),color:catStyle(p.titre,i).color})); h+=`<div class="card">${donut(slices,money(valE),'Titres')}<div class="note" style="text-align:center">Répartition par titre</div></div>`; }
  h+=`<div class="sec"><h2>Mes positions</h2><span class="lnk" onclick="location.href='/budget-famille/classic/'">Détail complet ›</span></div><div class="card">`;
  if(!pos.length)h+=`<div class="note" style="text-align:center;padding:12px">Aucune position sur ce marché.</div>`;
  pos.forEach((p,i)=>h+=catRow(p.titre, eurOf(p.val,p.dev), p.sgi+' · '+qtyFmt(p.qty)+' titres', i, {amtHtml:money(eurOf(p.val,p.dev)), amtSub:(p.pv>=0?'+':'')+money(eurOf(p.pv,p.dev))+' ('+(p.vp>=0?'+':'')+pctI(p.vp)+')'})); h+=`</div>`;
  const ops=(state.pf.ops||[]).filter(o=>inMkt(o.sgi)).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,6);
  if(ops.length){ h+=`<div class="sec"><h2>Dernières opérations</h2></div><div class="card">`; const OPL={depot:'Dépôt',achat:'Achat',vente:'Vente',retrait:'Retrait',dividende:'Dividende',frais:'Frais'};
    ops.forEach((o,i)=>{ const isT=o.type==='achat'||o.type==='vente'; const amt=isT?((+o.qty||0)*(+o.price||0)+(o.type==='achat'?1:-1)*(+o.fees||0)):(+o.amount||0); h+=catRow((OPL[o.type]||o.type)+(isT?' '+o.titre:''), eurOf(amt,o.devise), (o.sgi||'')+' · '+(o.date||''), i, {avatar:(o.type==='vente'||o.type==='depot'||o.type==='dividende')?'🟢':'🔴', amtHtml:money(eurOf(amt,o.devise))}); }); h+=`</div>`; }
  return h;
}

const NAV=[{k:'accueil',i:'🏠',l:'Accueil',p:1},{k:'analyse',i:'📊',l:'Analyse',p:1},{k:'budget',i:'🎯',l:'Budget',p:1},{k:'invest',i:'💼',l:'Patrimoine',p:1},{k:'revenus',i:'💰',l:'Revenus'},{k:'objectifs',i:'🎖️',l:'Objectifs'},{k:'exceptionnel',i:'💎',l:'Exceptionnel'},{k:'transferts',i:'🌍',l:'Transferts'}];
const SECT={accueil:secAccueil,analyse:secAnalyse,budget:secBudget,revenus:secRevenus,objectifs:secObjectifs,exceptionnel:secExceptionnel,transferts:secTransferts,invest:secInvest};
function setTitle(t){ const a=document.getElementById('title'); if(a)a.textContent=t; }
function kpi(k,v,cls){ return `<div class="kpi"><div class="k">${k}</div><div class="v ${cls||''}">${v}</div></div>`; }
function chgMonth(d){ MONTH=(MONTH+d+12)%12; render(); }
function setUI(k,v){ if(k==='amode')AMODE=v; else if(k==='bscope')BSCOPE=v; else if(k==='bper')BPER=v; else if(k==='cur')UICUR=v; else if(k==='mkt')UIMKT=v; saveUI(); render(); }
function setTab(k){ TAB=k; saveUI(); closePlus(); render(); }
function openPlus(){ document.getElementById('plusSheet').classList.add('on'); }
function closePlus(){ document.getElementById('plusSheet').classList.remove('on'); }
function renderNav(){
  document.getElementById('sidenav').innerHTML=NAV.map(n=>`<button class="navi ${TAB===n.k?'on':''}" onclick="setTab('${n.k}')"><span class="ni">${n.i}</span>${n.l}</button>`).join('');
  const prim=NAV.filter(n=>n.p);
  document.getElementById('tabbar').innerHTML=prim.map(n=>`<button class="tab ${TAB===n.k?'on':''}" onclick="setTab('${n.k}')"><span class="ti">${n.i}</span>${n.l}</button>`).join('')+`<button class="tab ${NAV.some(n=>!n.p&&n.k===TAB)?'on':''}" onclick="openPlus()"><span class="ti">⋯</span>Plus</button>`;
  document.getElementById('plusList').innerHTML=NAV.filter(n=>!n.p).map(n=>`<div class="row clk" onclick="setTab('${n.k}')"><div class="ic" style="background:var(--accent-soft);color:var(--accent)">${n.i}</div><div class="nm"><b>${n.l}</b></div><div class="chev">›</div></div>`).join('');
}
function render(){
  const s=document.getElementById('scroll'); let h='';
  if(!people.length){ h=`<div class="card"><div class="note">Aucune donnée sur cet appareil. Ouvre d'abord l'appli complète pour saisir ton budget, puis reviens ici.</div></div>`; }
  else { const head=`<div class="deskhead"><h1>${(NAV.find(n=>n.k===TAB)||{}).l||''}</h1><div class="note">${esc(MONTHS[MONTH])} ${YEARK}</div></div>`; h=head+(SECT[TAB]||secAccueil)(); }
  h+=`<div class="banner">✏️ Pour <b>saisir ou modifier</b> tes montants (salaires, dépenses…), ouvre l'appli classique — mêmes données. <span style="text-decoration:underline;cursor:pointer;font-weight:800" onclick="location.href='/budget-famille/classic/'">Ouvrir&nbsp;›</span></div>`;
  s.innerHTML=`<div class="fade">${h}</div>`; s.scrollTop=0; renderNav();
}
function toggleTheme(){ const cur=document.documentElement.getAttribute('data-theme'); const dark=matchMedia('(prefers-color-scheme: dark)').matches; const next=cur==='dark'?'light':cur==='light'?'dark':(dark?'light':'dark'); document.documentElement.setAttribute('data-theme',next); }
function nextYear(){ const ks=Object.keys(state.years||{}); if(ks.length<2){alert('Année : '+YEARK);return;} YEARK=ks[(ks.indexOf(String(YEARK))+1)%ks.length]; render(); }
['themeBtn','themeBtn2'].forEach(id=>{const e=document.getElementById(id);if(e)e.onclick=toggleTheme;});
['yearBtn','yearBtn2'].forEach(id=>{const e=document.getElementById(id);if(e)e.onclick=nextYear;});
document.getElementById('plusSheet').addEventListener('click',e=>{ if(e.target.id==='plusSheet')closePlus(); });
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
