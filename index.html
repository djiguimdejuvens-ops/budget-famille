<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<title>Budget Famille</title>
<style>
:root{
  --bg:#e9ebf5; --bg2:#eef0f9; --card:#ffffff; --ink:#141a2b; --muted:#8a92a8; --faint:#aab1c6; --line:#edeff6;
  --accent:#6c5ce7; --accent2:#8b7bff; --accent-soft:#ece9ff; --green:#22c55e; --green-ink:#16a34a; --red:#f43f6a; --amber:#f59e0b;
  --shadow:0 10px 30px rgba(23,30,60,.08); --shadow-sm:0 3px 12px rgba(23,30,60,.06); --r:22px;
}
@media (prefers-color-scheme: dark){ :root{ --bg:#080d18; --bg2:#0b1120; --card:#131b2e; --ink:#eaeefb; --muted:#8496b6; --faint:#5e6d8c; --line:#20293f; --accent:#7c6cf0; --accent2:#9a8bff; --accent-soft:#232046; --shadow:0 14px 34px rgba(0,0,0,.4); --shadow-sm:0 3px 14px rgba(0,0,0,.32); } }
:root[data-theme="dark"]{ --bg:#080d18; --bg2:#0b1120; --card:#131b2e; --ink:#eaeefb; --muted:#8496b6; --faint:#5e6d8c; --line:#20293f; --accent:#7c6cf0; --accent2:#9a8bff; --accent-soft:#232046; --shadow:0 14px 34px rgba(0,0,0,.4); --shadow-sm:0 3px 14px rgba(0,0,0,.32); }
:root[data-theme="light"]{ --bg:#e9ebf5; --bg2:#eef0f9; --card:#ffffff; --ink:#141a2b; --muted:#8a92a8; --faint:#aab1c6; --line:#edeff6; --accent:#6c5ce7; --accent2:#8b7bff; --accent-soft:#ece9ff; --shadow:0 10px 30px rgba(23,30,60,.08); --shadow-sm:0 3px 12px rgba(23,30,60,.06); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.shell{display:flex;min-height:100vh;max-width:1180px;margin:0 auto}
.app{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.scroll{flex:1;padding:6px 16px 100px;overflow-y:auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 18px) 16px 4px}
.top h1{font-size:20px;font-weight:850;margin:0;letter-spacing:-.3px}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;border:none;color:var(--ink);font-size:17px;cursor:pointer}
.top .right{display:flex;gap:8px}
.sidebar{display:none;flex-direction:column;width:236px;padding:22px 14px;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:17px;padding:6px 10px 16px;line-height:1.1}
.brand .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.navi{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:14px;color:var(--muted);font-weight:700;font-size:14.5px;cursor:pointer;border:none;background:transparent;width:100%;text-align:left}
.navi .ni{font-size:18px;width:22px;text-align:center}
.navi:hover{background:var(--bg2)}
.navi.on{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(108,92,231,.32)}
.sidefoot{margin-top:auto;display:flex;gap:8px;padding:8px 6px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.card.tight{padding:13px}
.monthsel{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:9px 12px;margin:10px 0}
.monthsel .m{font-weight:800;font-size:16px}
.chip{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.seg{display:flex;background:var(--card);border-radius:999px;box-shadow:var(--shadow-sm);padding:5px;gap:4px;margin:10px 0;overflow-x:auto}
.seg button{flex:1;min-width:max-content;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:9px 14px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(108,92,231,.35)}
.seg.sub button.on{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.hero{text-align:center;padding:24px 16px 18px}
.hero .lbl{color:var(--muted);font-weight:700;font-size:12.5px;letter-spacing:.4px;text-transform:uppercase}
.hero .big{font-size:40px;font-weight:850;letter-spacing:-1.2px;margin:6px 0 2px}
.hero .sub{color:var(--muted);font-size:13px}
.pos{color:var(--green-ink)}.neg{color:var(--red)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--card);border-radius:18px;box-shadow:var(--shadow-sm);padding:14px}
.kpi .k{color:var(--muted);font-size:12px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:20px;font-weight:850;letter-spacing:-.3px}
.row{display:flex;align-items:center;gap:13px;padding:12px 2px}
.row.clk{cursor:pointer}
.row+.row{border-top:1px solid var(--line)}
.ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 44px;font-weight:800}
.ic.sm{width:34px;height:34px;flex:0 0 34px;font-size:15px}
.row .nm{flex:1;min-width:0}
.row .nm b{font-weight:700;font-size:15.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{color:var(--muted);font-size:12.5px}
.row .amt{font-weight:800;font-size:15.5px;white-space:nowrap;text-align:right}
.row .amt small{display:block;font-weight:700;font-size:11.5px;color:var(--muted)}
.chev{color:var(--faint);font-size:16px;margin-left:2px}
.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.barlbl{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 6px}
.sec h2{font-size:16px;font-weight:850;margin:0}
.sec .lnk{color:var(--accent);font-weight:700;font-size:13px;cursor:pointer}
.pbar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:12px 0 8px}
.pbar>i{height:100%}
.plegend{display:flex;gap:16px;flex-wrap:wrap}
.plegend .li{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.donutwrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 2px}
.tabbar{position:sticky;bottom:0;display:flex;justify-content:space-around;align-items:center;background:color-mix(in srgb,var(--card) 90%, transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;padding:4px 8px;flex:1}
.tab .ti{font-size:20px;line-height:1}
.tab.on{color:var(--accent)}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap}
.pill.g{background:rgba(34,197,94,.15);color:var(--green-ink)}
.pill.r{background:rgba(244,63,106,.15);color:var(--red)}
.pill.n{background:var(--accent-soft);color:var(--accent)}
.note{color:var(--muted);font-size:12.5px;line-height:1.5}
.banner{background:var(--accent-soft);color:var(--accent);border-radius:16px;padding:11px 14px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center;margin:12px 0}
.subline{display:flex;align-items:center;gap:10px;padding:10px 2px;font-size:14px}
.subline+.subline{border-top:1px dashed var(--line)}
.subline .sn{flex:1;color:var(--ink)}.subline .sv{font-weight:800}
.monthpin{position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + 72px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:999px;padding:5px 8px;font-weight:800;font-size:13.5px;white-space:nowrap}
.monthpin[hidden]{display:none}.monthpin .pinbtn{border:none;background:var(--accent-soft);color:var(--accent);width:26px;height:26px;border-radius:50%;font-size:16px;font-weight:800;cursor:pointer;line-height:1;padding:0}.monthpin.year .pinbtn{display:none}.monthpin.year{padding:7px 14px}
.pbrow{padding:9px 0;border-top:1px dashed var(--line)}.pbrow:first-child{border-top:none}.pbhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}.pbname{display:flex;align-items:center;gap:8px;font-weight:800;min-width:0}.pbname .ic{width:28px;height:28px;flex:0 0 28px;font-size:13px}.pbval{text-align:right;white-space:nowrap;font-size:14px}.pbval small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.tlbar{display:flex;gap:4px;margin-top:9px}.tlbar button{position:relative;flex:1;min-width:0;border:none;border-radius:9px;padding:7px 0 10px;font-weight:800;font-size:11px;background:var(--bg2);color:var(--muted);cursor:pointer;line-height:1.1}.tlbar button.has{color:var(--ink)}.tlbar button.off{opacity:.42}.tlbar button.on{background:var(--accent);color:#fff;opacity:1;box-shadow:0 5px 12px rgba(108,92,231,.3)}.tlbar button i{position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--green)}.tlbar button.on i{background:#fff}
.ptab td.off,.ptab th.off{opacity:.35}.ptab tr.off td{opacity:.4}
.pbtrack{position:relative;height:12px;border-radius:7px;background:var(--bg2);margin:7px 0 4px;overflow:hidden}.pbtrack i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}.pbtrack i.plan{background:var(--line)}.pbtrack i.real{opacity:.92}.pbsub{font-size:11.5px;color:var(--muted)}.pbsub.neg{color:var(--red);font-weight:700}
.b3{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:8px 2px;font-size:13.5px}.b3+.b3{border-top:1px dashed var(--line)}.b3 .sn{color:var(--ink);min-width:0}.b3 .sv{font-weight:800;text-align:right;min-width:78px;white-space:nowrap}.b3 .sp{font-weight:700;color:var(--muted);text-align:right;min-width:78px;white-space:nowrap;font-variant-numeric:tabular-nums}.b3.hd{padding:2px 2px 3px;font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:800;border:none}.b3.hd .sv{font-size:10px;color:var(--muted)}
.fade{animation:fade .26s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.sheet{position:fixed;inset:0;background:rgba(10,15,28,.5);display:none;align-items:flex-end;z-index:50}
.sheet.on{display:flex}
.sheetbox{background:var(--card);width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:10px 14px calc(20px + env(safe-area-inset-bottom));max-height:75vh;overflow:auto}
.sheet .grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 12px}
svg{display:block}
.chartbars{display:flex;align-items:flex-end;gap:5px;height:120px;padding:4px 0}
.chartbars .cb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.chartbars .cb i{width:70%;max-width:22px;border-radius:6px 6px 3px 3px;display:block}
.chartbars .cb small{font-size:9px;color:var(--faint)}
.chartbars .cb .cbv{font-size:8.5px;font-weight:800;color:var(--muted);line-height:1;white-space:nowrap}
.cur{font-size:.62em;font-weight:700;color:var(--muted);margin-left:.24em;letter-spacing:.2px;vertical-align:baseline}
.ptab{border-collapse:collapse;font-size:12px;width:100%}
.ptab th,.ptab td{padding:7px 7px;text-align:right;white-space:nowrap}
.ptab thead th{position:sticky;top:0;background:var(--card);color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.ptab th.pnm,.ptab td.pnm{text-align:left;position:sticky;left:0;background:var(--card);font-weight:700;z-index:1;box-shadow:1px 0 0 var(--line)}
.ptab thead th.pnm{z-index:3}
.ptab tbody tr{border-top:1px solid var(--line)}
.ptab tbody tr.clk{cursor:pointer}
.ptab tbody tr.clk:hover td{background:var(--accent-soft)}
.ptab td.prev{color:var(--faint)}
.ptab th.now{color:var(--accent)}
.ptab .pplan{color:var(--accent);font-weight:800;box-shadow:inset 1px 0 0 var(--line),inset -1px 0 0 var(--line)}
.ptab thead th.pplan{color:var(--accent)}
.itip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:800 11px -apple-system;cursor:pointer;border:none;margin-left:6px;vertical-align:middle;flex:0 0 auto;padding:0}
.itip .tip{display:none;position:absolute;z-index:60;top:24px;left:0;width:min(80vw,272px);background:var(--accent);color:#fff;font:500 12px/1.5 -apple-system;padding:10px 12px;border-radius:10px;box-shadow:var(--shadow);text-align:left;white-space:normal;font-style:normal}
.itip:hover .tip,.itip.on .tip{display:block}
.itip .tip b{color:#fff;font-weight:800}
.ln+.ln{border-top:1px solid var(--line)}
.shr{display:flex;gap:14px;flex-wrap:wrap;padding:0 2px 8px 47px;margin-top:-5px;font-size:12px;color:var(--muted)}
.shr b{font-weight:700}
.ghostbtn{border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:11px;padding:8px 12px;font-weight:800;font-size:13px;cursor:pointer}
.ptab tr.rev td{color:var(--green-ink)}
.ptab tr.sum td{font-weight:800;border-top:2px solid var(--line)}
.ptab .ptot{font-weight:800}
.ptab .pmoy{color:var(--muted)}
.ptab td.pos{color:var(--green-ink)}
.ptab td.neg{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
.deskhead{display:none}
.medit{width:100px;text-align:right;padding:9px 11px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg2);color:var(--ink);font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.medit:focus{outline:none;border-color:var(--accent);background:var(--card)}
.medit::placeholder{color:var(--faint);font-weight:600}
.mrow{display:flex;align-items:center;gap:9px;padding:9px 2px}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow .ml{flex:1;color:var(--ink);font-size:14px;font-weight:600}
.mrow.today{background:var(--accent-soft);border-radius:12px;padding:9px 8px;margin:2px 0}
.mrow.today+.mrow{border-top:none}
.dhead{display:flex;align-items:center;gap:10px;padding:2px 2px 12px}
.dhead .bk{border:none;background:var(--bg2);color:var(--ink);border-radius:11px;width:38px;height:38px;font-size:17px;font-weight:800;cursor:pointer;flex:0 0 38px}
.dhead h3{margin:0;font-size:18px;font-weight:850;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhead .tot{font-weight:850;font-size:16px}
.editbtn{border:none;background:var(--accent-soft);color:var(--accent);border-radius:11px;padding:8px 12px;font-weight:800;font-size:13px;cursor:pointer}
.delbtn{border:none;background:rgba(244,63,106,.14);color:var(--red);border-radius:11px;padding:8px 12px;font-weight:800;font-size:13px;cursor:pointer}
.nameedit{flex:1;text-align:left;width:auto;padding:9px 11px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg2);color:var(--ink);font-size:15px;font-weight:700}
.saverow{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.msel{width:100%;padding:10px 11px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg2);color:var(--ink);font-size:15px;font-weight:700;-webkit-appearance:none;appearance:none}
.frow{display:flex;align-items:center;gap:10px;padding:7px 2px}
.frow>label{width:92px;color:var(--muted);font-size:13px;font-weight:700;flex:0 0 92px}
.fin{flex:1;min-width:0;padding:10px 11px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg2);color:var(--ink);font-size:15px;font-weight:600}
.fin:focus,.msel:focus{outline:none;border-color:var(--accent);background:var(--card)}
@media (min-width:900px){
  .sheetbox{max-width:560px;border-radius:22px;margin-bottom:6vh}
  .sheet{align-items:center}
  .sidebar{display:flex}
  .tabbar{display:none}
  .app{background:var(--bg2)}
  .scroll{padding:12px 30px 44px}
  .top{display:none}
  .kgrid{grid-template-columns:repeat(4,1fr)}
  .grid2{grid-template-columns:1fr 1fr}
  .deskhead{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 2px}
  .deskhead h1{font-size:26px;font-weight:850;margin:0;letter-spacing:-.5px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="logo">₿</div> Budget<br>Famille</div>
    <div id="sidenav"></div>
    <div class="sidefoot"><a class="navi" href="/budget-famille/classic/" style="text-decoration:none" title="Ancienne interface, gardée en sauvegarde"><span class="ni">🗄️</span>Ancienne appli</a></div>
    <div class="sidefoot" style="margin-top:0"><button class="iconbtn" id="themeBtn2">◐</button><button class="iconbtn" id="yearBtn2">📅</button></div>
  </aside>
  <div class="app">
    <div class="top"><button class="iconbtn" id="themeBtn">◐</button><h1 id="title">Accueil</h1><div class="right"><a class="iconbtn" href="/budget-famille/classic/" title="Ancienne appli (sauvegarde)" style="text-decoration:none">🗄️</a><button class="iconbtn" id="yearBtn">📅</button></div></div>
    <div class="scroll" id="scroll"></div>
    <div id="monthPin" class="monthpin" hidden><button class="pinbtn" onclick="pinNav(-1)" aria-label="Mois précédent">‹</button><span id="monthPinTxt"></span><button class="pinbtn" onclick="pinNav(1)" aria-label="Mois suivant">›</button></div>
    <nav class="tabbar" id="tabbar"></nav>
  </div>
</div>
<div class="sheet" id="plusSheet"><div class="sheetbox"><div class="grip"></div><div id="plusList"></div></div></div>

/* ── BILAN & ÉPARGNE AUTO : une seule source de calcul (chacun + couple, mois ou année). Épargne = entrées − sorties, jamais saisie ; communes comptées UNE fois pour le couple. ── */
function bilan(scope,m,upTo){ // réel = réel saisi (prévu pour les cases vides) · P = prévu pur · upTo = dernier mois compté (chronologie), 11 par défaut
  const couple = scope==='Couple'||scope==='Foyer'||scope==='Combiné';
  const one = mm=>{ const rev= couple? people.reduce((s,p)=>s+personFullIncome(p,mm),0) : personFullIncome(scope,mm);
    const com= couple? foyerTotal(mm,'real') : communeShare(scope,mm,'real'), ind= couple? people.reduce((s,p)=>s+persoTotal(p,mm,'real'),0) : persoTotal(scope,mm,'real');
    const comP= couple? foyerTotal(mm,'planned') : communeShare(scope,mm,'planned'), indP= couple? people.reduce((s,p)=>s+persoTotal(p,mm,'planned'),0) : persoTotal(scope,mm,'planned');
    const pl= couple? placedAll(mm,'real') : placed(scope,mm,'real'), plP= couple? placedAll(mm,'planned') : placed(scope,mm,'planned');
    return {rev,com,ind,ep:rev-com-ind,comP,indP,epP:rev-comP-indP,pl,plP,done:realizedMonth(mm)}; };
  if(m!=null) return one(m);
  const last=(upTo==null)?11:Math.max(0,Math.min(11,+upTo)); const t={rev:0,com:0,ind:0,ep:0,comP:0,indP:0,epP:0,pl:0,plP:0,months:[],upTo:last}; for(let mm=0;mm<12;mm++){ const b=one(mm); t.months.push(b); if(mm<=last) ['rev','com','ind','ep','comP','indP','epP','pl','plP'].forEach(k=>t[k]+=b[k]); } return t;
}

  return h+`</div>`;
}

  if(e.key!=='Enter') return;
  const fillAll=e.altKey||((e.metaKey||e.ctrlKey)&&e.shiftKey), fillRest=(e.metaKey||e.ctrlKey)&&!e.shiftKey&&!e.altKey; // Maj seule n'est plus un raccourci : sur AZERTY on tape les chiffres avec Maj et on appuie souvent Entrée avant de la relâcher
  if(!(fillAll||fillRest)||el.dataset.fill!=='1'){ e.preventDefault(); const k=cellKey(el); el.blur(); /* valide (onchange, éventuel redessin) */ const nx=findCell(k); if(nx){ nx.focus(); try{ nx.select(); }catch(x){} } return; } // Entrée / Maj+Entrée → valide + cellule du dessous

function donut(slices,big,sub){
  const total=slices.reduce((s,x)=>s+Math.max(0,x.value),0)||1; const R=54,C=2*Math.PI*R; let off=0;
  const rings=slices.filter(s=>s.value>0).map(s=>{ const len=s.value/total*C; const seg=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)" style="cursor:pointer"><title>${esc(s.label||'')}</title></circle>`; off+=len; return seg; }).join('');
  return `<div class="donutwrap"><svg width="172" height="172" viewBox="0 0 140 140">${rings}<text x="70" y="66" text-anchor="middle" fill="var(--ink)" style="font:850 19px -apple-system">${esc(big)}</text><text x="70" y="86" text-anchor="middle" fill="var(--muted)" style="font:600 11px -apple-system">${esc(sub)}</text></svg></div>`;
}

function donutLegend(items,fmt){ fmt=fmt||eur; if(!items.length)return''; const total=items.reduce((s,x)=>s+(x.value||0),0)||1; return `<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">${items.map(it=>`<div style="display:flex;align-items:center;gap:9px;font-size:13.5px"><span style="width:12px;height:12px;border-radius:4px;background:${it.color};flex:0 0 12px"></span><span style="flex:1;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.name)}</span><span style="color:var(--muted);font-weight:800;white-space:nowrap">${fmt(it.value)} · ${Math.round(it.value/total*100)}%</span></div>`).join('')}</div>`; }

function dualBar(a,b,labels){ const max=Math.max(1,...a.map(v=>Math.abs(v)),...b.map(v=>Math.abs(v))); return `<div style="display:flex;align-items:flex-end;gap:3px;height:104px;padding:4px 0">${labels.map((lb,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0" title="${esc(lb)} — revenus ${eur(a[i])} · dépenses ${eur(b[i])}"><div style="display:flex;align-items:flex-end;gap:2px;height:82px"><i style="width:8px;height:${Math.max(2,Math.abs(a[i])/max*80)}px;background:var(--green);border-radius:3px 3px 0 0"></i><i style="width:8px;height:${Math.max(2,Math.abs(b[i])/max*80)}px;background:var(--accent);border-radius:3px 3px 0 0"></i></div><small style="font-size:9px;color:var(--faint)">${esc((lb||'')[0])}</small></div>`).join('')}</div><div class="plegend" style="justify-content:center;margin-top:6px"><div class="li"><span class="dot" style="background:var(--green)"></span>Revenus</div><div class="li"><span class="dot" style="background:var(--accent)"></span>Dépenses</div></div>`; }
function stackBar(labels,series){ // barres empilées (par personne), agrandies + total au-dessus
  const totals=labels.map((_,i)=>series.reduce((s,se)=>s+Math.max(0,se.vals[i]||0),0));

  return `<div style="display:flex;align-items:flex-end;gap:4px;padding:6px 0">${labels.map(col).join('')}</div><div class="plegend" style="justify-content:center;margin-top:8px">${series.map(se=>`<div class="li"><span class="dot" style="background:${se.color}"></span><b style="color:var(--ink)">${esc(se.name)}</b></div>`).join('')}</div>`;

function lineChart(vals,labels){
  const W=600,H=180,pl=10,pr=10,pt=24,pb=20; const min=Math.min(0,...vals),max=Math.max(1,...vals),rng=(max-min)||1;
  const px=i=>pl+i*(W-pl-pr)/Math.max(1,vals.length-1), py=v=>H-pb-(v-min)/rng*(H-pt-pb);
  const pts=vals.map((v,i)=>[px(i),py(v)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L ${px(vals.length-1).toFixed(1)} ${(H-pb).toFixed(1)} L ${px(0).toFixed(1)} ${(H-pb).toFixed(1)} Z`;
  const zero=py(0), step=Math.max(1,Math.ceil(vals.length/8)), sp=(W-pl-pr)/Math.max(1,vals.length-1);
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--accent)"/>`).join('');
  const vlab=pts.map((p,i)=> (i%step===0||i===vals.length-1)?`<text x="${p[0].toFixed(1)}" y="${(p[1]-8).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)">${esc(kfmt(vals[i]))}</text>`:'').join('');
  const xlab=labels?pts.map((p,i)=> (i%step===0||i===vals.length-1)?`<text x="${p[0].toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="10.5" fill="var(--faint)">${esc(labels[i]||'')}</text>`:'').join(''):'';
  const bands=pts.map((p,i)=>`<rect x="${(px(i)-sp/2).toFixed(1)}" y="0" width="${sp.toFixed(1)}" height="${H}" fill="transparent" style="cursor:pointer"><title>${esc((labels&&labels[i])||('#'+(i+1)))} : ${eur(vals[i])}</title></rect>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block"><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".26"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><line x1="0" x2="${W}" y1="${zero.toFixed(1)}" y2="${zero.toFixed(1)}" stroke="var(--line)" stroke-width="1"/><path d="${area}" fill="url(#lg)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${vlab}${xlab}${bands}</svg>`;
}

function pfMarket(sgi){ const s=(sgi||'').toLowerCase(); if(/coris|brvm/.test(s))return'BRVM'; if(/binance|okx|crypto|bitcoin|ether|coin|btc|eth/.test(s))return'Crypto'; if(/fortuneo|euronext|bourso|pea/.test(s))return'Euronext'; return'Autre'; }
function eurOf(v,dev){ return dev==='XOF'? v*FX() : v; }
function dispEur(v){ return UICUR==='XOF'? v/FX() : v; }
function moneyNum(vEur,signed){ const x=dispEur(vEur); const n=UICUR==='XOF'? Math.round(x).toLocaleString('fr-FR') : num(x); return (signed&&vEur>0?'+':'')+n; }
function moneyTxt(vEur,signed){ return moneyNum(vEur,signed)+(UICUR==='XOF'?' FCFA':' €'); }
function money(vEur,signed){ return moneyNum(vEur,signed)+'<span class="cur">'+(UICUR==='XOF'?'FCFA':'€')+'</span>'; }
function kfmt(n){ n=Math.round(+n||0); const a=Math.abs(n); if(a>=1e6)return (n/1e6).toFixed(a>=1e7?0:1).replace('.',',')+'M'; if(a>=1000)return (n/1000).toFixed(a>=1e4?0:1).replace('.',',')+'k'; return String(n); }
function hasPf(){ return state.pf&&state.pf.ops&&state.pf.ops.length; }
function pfValueEur(){ if(!hasPf())return 0; return pfPositions().reduce((s,p)=>s+eurOf(p.val,p.dev),0); }
function pfCashEur(){ if(!hasPf())return 0; const c=pfCash(); return Object.keys(c).reduce((s,sgi)=>s+eurOf(c[sgi].amt,c[sgi].dev),0); }
function toEUR(v,dev){ v=+v||0; if(!dev||dev==='EUR')return v; if(dev==='XOF'||dev==='FCFA')return v*FX(); return v*((state.fx&&state.fx[dev])||1); }
function pfPositions(){ const pos={}; (state.pf.ops||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(o=>{ if(o.type!=='achat'&&o.type!=='vente')return; const k=(o.sgi||'?')+'|'+(o.titre||'?'); if(!pos[k])pos[k]={sgi:o.sgi,titre:o.titre,dev:o.devise||'EUR',qty:0,cost:0}; const P=pos[k],q=+o.qty||0,pr=+o.price||0,fr=+o.fees||0; if(o.type==='achat'){P.qty+=q;P.cost+=q*pr+fr;}else{const cmp=P.qty?P.cost/P.qty:0;P.cost-=cmp*Math.min(q,P.qty);P.qty-=q;if(P.qty<1e-6){P.qty=0;P.cost=0;}} });
  return Object.values(pos).filter(p=>p.qty>1e-6).map(p=>{ const cmp=p.qty?p.cost/p.qty:0,key=p.sgi+'|'+p.titre; const price=(state.pf.prices&&state.pf.prices[key]!=null&&state.pf.prices[key]!=='')?+state.pf.prices[key]:cmp; const val=p.qty*price; return {sgi:p.sgi,titre:p.titre,dev:p.dev,qty:p.qty,cmp,price,val,pv:val-p.qty*cmp,vp:cmp?(price-cmp)/cmp:0,key}; }).sort((a,b)=>eurOf(b.val,b.dev)-eurOf(a.val,a.dev)); }
function pfCash(){ const c={}; (state.pf.ops||[]).forEach(o=>{ const dev=o.devise||'EUR',sgi=o.sgi||'?'; if(!c[sgi])c[sgi]={dev,amt:0}; const x=c[sgi]; if(o.type==='depot'||o.type==='dividende')x.amt+=(+o.amount||0); else if(o.type==='retrait'||o.type==='frais')x.amt-=(+o.amount||0); else if(o.type==='achat')x.amt-=((+o.qty||0)*(+o.price||0)+(+o.fees||0)); else if(o.type==='vente')x.amt+=((+o.qty||0)*(+o.price||0)-(+o.fees||0)); }); return c; }
function pfRealized(mkt){ const run={}; let realized=0; (state.pf.ops||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(o=>{ if(mkt&&mkt!=='all'&&pfMarket(o.sgi)!==mkt)return; const dev=o.devise||'EUR'; const k=(o.sgi||'?')+'|'+(o.titre||'?'); if(o.type==='achat'){ const p=run[k]||(run[k]={qty:0,cost:0}); p.qty+=(+o.qty||0); p.cost+=(+o.qty||0)*(+o.price||0)+(+o.fees||0);} else if(o.type==='vente'){ const p=run[k]||(run[k]={qty:0,cost:0}); const cmp=p.qty?p.cost/p.qty:0; const q=+o.qty||0; realized+=eurOf(q*(+o.price||0)-(+o.fees||0)-cmp*q,dev); p.cost-=cmp*Math.min(q,p.qty); p.qty-=q; if(p.qty<1e-6){p.qty=0;p.cost=0;} } }); return realized; }
function pfPerYear(mkt){ const run={},py={}; const ey=y=>py[y]||(py[y]={realized:0,div:0,fee:0}); (state.pf.ops||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(o=>{ if(mkt&&mkt!=='all'&&pfMarket(o.sgi)!==mkt)return; const dev=o.devise||'EUR'; const y=(o.date||'????').slice(0,4); if(o.type==='dividende'){ ey(y).div+=eurOf(+o.amount||0,dev); return; } if(o.type==='frais'){ ey(y).fee+=eurOf(+o.amount||0,dev); return; } const k=(o.sgi||'?')+'|'+(o.titre||'?'); if(o.type==='achat'){ const p=run[k]||(run[k]={qty:0,cost:0}); p.qty+=(+o.qty||0); p.cost+=(+o.qty||0)*(+o.price||0)+(+o.fees||0); } else if(o.type==='vente'){ const p=run[k]||(run[k]={qty:0,cost:0}); const cmp=p.qty?p.cost/p.qty:0; const q=+o.qty||0; ey(y).realized+=eurOf(q*(+o.price||0)-(+o.fees||0)-cmp*q,dev); p.cost-=cmp*Math.min(q,p.qty); p.qty-=q; if(p.qty<1e-6){p.qty=0;p.cost=0;} } }); return py; }
function pfRealizedSeries(mkt){ const ops=(state.pf.ops||[]).filter(o=>(!mkt||mkt==='all'||pfMarket(o.sgi)===mkt)&&/^\d{4}-\d{2}/.test(o.date||'')).slice().sort((a,b)=>a.date.localeCompare(b.date)); if(!ops.length)return {labels:[],vals:[]}; const run={},byM={}; ops.forEach(o=>{ const dev=o.devise||'EUR',k=(o.sgi||'?')+'|'+(o.titre||'?'),mk=o.date.slice(0,7); let g=0; if(o.type==='achat'){ const p=run[k]||(run[k]={qty:0,cost:0}); p.qty+=(+o.qty||0); p.cost+=(+o.qty||0)*(+o.price||0)+(+o.fees||0); } else if(o.type==='vente'){ const p=run[k]||(run[k]={qty:0,cost:0}); const cmp=p.qty?p.cost/p.qty:0,q=+o.qty||0; g=eurOf(q*(+o.price||0)-(+o.fees||0)-cmp*q,dev); p.cost-=cmp*Math.min(q,p.qty); p.qty-=q; if(p.qty<1e-6){p.qty=0;p.cost=0;} } else if(o.type==='dividende'){ g=eurOf(+o.amount||0,dev); } else if(o.type==='frais'){ g=-eurOf(+o.amount||0,dev); } byM[mk]=(byM[mk]||0)+g; }); let yy=+ops[0].date.slice(0,4),mm=+ops[0].date.slice(5,7)-1; const now=new Date(),labels=[],vals=[]; let cum=0,gg=0; while(gg++<60){ const key=yy+'-'+String(mm+1).padStart(2,'0'); cum+=(byM[key]||0); labels.push(MSHORT[mm]+' '+String(yy).slice(2)); vals.push(Math.round(cum)); if(yy===now.getFullYear()&&mm===now.getMonth())break; mm++; if(mm>11){mm=0;yy++;} } return {labels,vals}; }
function pfSellLog(mkt){ const run={},log=[]; (state.pf.ops||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(o=>{ if(mkt&&mkt!=='all'&&pfMarket(o.sgi)!==mkt)return; const dev=o.devise||'EUR',k=(o.sgi||'?')+'|'+(o.titre||'?'); if(o.type==='achat'){ const p=run[k]||(run[k]={qty:0,cost:0}); p.qty+=(+o.qty||0); p.cost+=(+o.qty||0)*(+o.price||0)+(+o.fees||0); } else if(o.type==='vente'){ const p=run[k]||(run[k]={qty:0,cost:0}); const cmp=p.qty?p.cost/p.qty:0,q=+o.qty||0,costOut=cmp*q,proceeds=q*(+o.price||0)-(+o.fees||0); log.push({date:o.date,sgi:o.sgi,titre:o.titre,qty:q,cost:eurOf(costOut,dev),realized:eurOf(proceeds-costOut,dev),pct:costOut?(proceeds-costOut)/costOut:0}); p.cost-=cmp*Math.min(q,p.qty); p.qty-=q; if(p.qty<1e-6){p.qty=0;p.cost=0;} } }); return log; }
function pfRealizedSeriesYear(mkt,year){ const run={},byM=new Array(12).fill(0); (state.pf.ops||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(o=>{ if(mkt&&mkt!=='all'&&pfMarket(o.sgi)!==mkt)return; const dev=o.devise||'EUR',k=(o.sgi||'?')+'|'+(o.titre||'?'); if(o.type==='achat'){ const p=run[k]||(run[k]={qty:0,cost:0}); p.qty+=(+o.qty||0); p.cost+=(+o.qty||0)*(+o.price||0)+(+o.fees||0); } else if(o.type==='vente'){ const p=run[k]||(run[k]={qty:0,cost:0}); const cmp=p.qty?p.cost/p.qty:0,q=+o.qty||0,g=eurOf(q*(+o.price||0)-(+o.fees||0)-cmp*q,dev); if(String(o.date||'').slice(0,4)===String(year)){ const m=+String(o.date).slice(5,7)-1; if(m>=0&&m<12)byM[m]+=g; } p.cost-=cmp*Math.min(q,p.qty); p.qty-=q; if(p.qty<1e-6){p.qty=0;p.cost=0;} } }); let cum=0; const vals=byM.map(v=>{cum+=v;return Math.round(cum);}); return {labels:MSHORT.slice(),vals}; }
function pfCapitalSeries(mkt){ const ops=(state.pf.ops||[]).filter(o=>(!mkt||mkt==='all'||pfMarket(o.sgi)===mkt) && /^\d{4}-\d{2}/.test(o.date||'')).slice().sort((a,b)=>a.date.localeCompare(b.date)); if(!ops.length)return {labels:[],vals:[]}; const byM={}; ops.forEach(o=>{ const k=o.date.slice(0,7); let flow=0; if(o.type==='depot')flow=eurOf(+o.amount||0,o.devise||'EUR'); else if(o.type==='retrait')flow=-eurOf(+o.amount||0,o.devise||'EUR'); byM[k]=(byM[k]||0)+flow; }); let yy=+ops[0].date.slice(0,4), mm=+ops[0].date.slice(5,7)-1; const now=new Date(); const labels=[],vals=[]; let cum=0,g=0; while(g++<60){ const key=yy+'-'+String(mm+1).padStart(2,'0'); cum+=(byM[key]||0); labels.push(MSHORT[mm]+' '+String(yy).slice(2)); vals.push(Math.round(cum)); if(yy===now.getFullYear()&&mm===now.getMonth())break; mm++; if(mm>11){mm=0;yy++;} } return {labels,vals}; }

const LIVE=(()=>{try{const r=localStorage.getItem('budgetFamille_v1');return !!(r&&JSON.parse(r).years);}catch(e){return false;}})();
let UNDO=[];
function save(){ if(!LIVE) return false; try{ const old=localStorage.getItem('budgetFamille_v1'); if(old){ UNDO.push(old); if(UNDO.length>40)UNDO.shift(); } state.lastEdit=Date.now(); localStorage.setItem('budgetFamille_v1',JSON.stringify(state)); try{pushRemote();}catch(e){} return true; }catch(e){ return false; } }
function undoChange(){ if(!UNDO.length){ toast('Rien à annuler.'); return; } const prev=UNDO.pop(); try{ state=JSON.parse(prev); localStorage.setItem('budgetFamille_v1',prev); if(!state.years[YEARK])YEARK=Object.keys(state.years)[0]; document.getElementById('detailSheet').classList.remove('on'); DETAIL=null; render(); toast('Annulé ✓'); }catch(e){ toast('Impossible d\'annuler.'); } }
function roundRule(n){ n=Number(n)||0; return Math.abs(n)<50?Math.round(n*10)/10:Math.round(n); } // règles du user : < 50 → 1 décimale, sinon entier
function parseNum(v){ if(v==null||v==='')return 0; let s=(''+v).trim().replace(/€/g,'').replace(/\s/g,'').replace(/,/g,'.').replace(/^=/,'').replace(/[x×]/gi,'*').replace(/÷/g,'/').replace(/−/g,'-'); if(!s)return 0; if(/[+\-*/()]/.test(s)&&/^[0-9.+\-*/()]+$/.test(s)){ try{ const r=Function('"use strict";return ('+s+')')(); if(typeof r==='number'&&isFinite(r))return r; }catch(e){} } const f=parseFloat(s); return isNaN(f)?0:f; }
function jsq(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function foyerLine(id){ return Y().foyer.find(l=>l.id===id); }
function persoLine(p,id){ return ((Y().persons[p]&&Y().persons[p].cats)||[]).find(l=>l.id===id); }
function newId(){ return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
let DETAIL=null;
function openGroup(kind,group,person){ DETAIL={level:'group',kind,group,person:person||null}; showDetail(); }
function openLine(kind,id,person,group){ DETAIL={level:'line',kind,id,person:person||null,group}; showDetail(); }
function detailBack(){ if(DETAIL&&DETAIL.level==='line'){ openGroup(DETAIL.kind,DETAIL.group,DETAIL.person); } else closeDetail(); }
function closeDetail(){ document.getElementById('detailSheet').classList.remove('on'); DETAIL=null; render(); }
function showDetail(){ document.getElementById('detailSheet').classList.add('on'); renderDetail(); try{ updatePin(); }catch(e){} }
function withFocus(fn){ withFocusIn('detailBody',fn); } // fiche : garde la cellule active quand elle est redessinée

      let parts=''; if(isF&&people.length>1&&v){ if(an) parts=' · '+people.map(p=>esc(p[0])+' '+num2(sumM(m=>prorataN(p,m)*vM(l,m)))).join(' · '); else { const ps=splitParts(v,MONTH); parts= ps? ' · '+people.map((p,i2)=>esc(p[0])+' '+num2(ps[i2])).join(' · ') : ' · parts non calculables'; } }

      h+=`<div class="row"><div class="ic sm" style="background:${tint(st.color)};color:${st.color};cursor:pointer" onclick="${op}">${st.emoji}</div><div class="nm" style="flex:1;min-width:0;cursor:pointer" onclick="${op}"><b>${esc(l.name)}</b><span>${sub}</span></div><div class="amt">${eur(v)}</div><button class="chip" style="width:30px;height:30px;flex:0 0 30px;font-size:14px" title="Monter" onclick="event.stopPropagation();moveLine('${kind}','${l.id}',${pq},-1)">↑</button><button class="chip" style="width:30px;height:30px;flex:0 0 30px;font-size:14px" title="Descendre" onclick="event.stopPropagation();moveLine('${kind}','${l.id}',${pq},1)">↓</button><div class="chev" style="cursor:pointer" onclick="${op}">›</div></div>`; });

      if(DARCH) arch.forEach(l=>{ const tot=sumM(m=>(l.real||[])[m]||0); h+=`<div class="row"><div class="nm" style="flex:1;min-width:0"><b style="color:var(--muted)">${esc(l.name)}</b><span>${archSince(l)?archSince(l)+' · ':''}réel ${eur(tot)}</span></div><button class="editbtn" onclick="unarchiveLine('${kind}','${l.id}',${pq})">Restaurer</button><button class="delbtn" style="margin-left:6px" title="Supprimer définitivement" onclick="delLine('${kind}','${l.id}',${pq})">🗑️</button></div>`; });

    body.innerHTML=h;
  } else {
    const {kind,id,person,group}=DETAIL; const l = kind==='foyer'? foyerLine(id):persoLine(person,id); if(!l){ detailBack(); return; }

    head.innerHTML=`<div class="dhead"><button class="bk" onclick="detailBack()">‹</button><h3>${esc(l.name)}${infoTip(l.auto?'Dîme automatique = 10 % du revenu (calculée, non modifiable).':'Saisis le <b>prévu</b> et le <b>réel</b> de chaque mois. Une case RÉEL vide n’est pas un 0 : le prévu de la ligne est retenu dans les totaux ; tape <b>0</b> si rien n’a été dépensé. La virgule et une formule (<b>=1040</b>, <b>40*12</b>) sont acceptées. <b>Entrée</b> valide et passe à la cellule du dessous ; <b>Effacer</b> sur une case vide écrit 0 (rien dépensé). <b>Ctrl/Cmd+Entrée</b> recopie la valeur du mois courant jusqu’à décembre, <b>Alt+Entrée</b> (ou Ctrl/Cmd+Maj+Entrée) sur toute l’année. Les formules marchent : 100+50, 25x4, 300/3.')}</h3><span class="tot">${eur(totP)}<small style="display:block;font-size:11px;color:var(--muted);font-weight:600;text-align:right">prévu / an</small></span></div>`;

    if(!l.auto) h+=`<div class="mrow" style="border:none;padding-bottom:10px;flex-wrap:wrap;gap:6px"><input class="nameedit" style="flex:1;min-width:120px" value="${esc(l.name)}" onchange="renameLine('${kind}','${id}',${pq},this.value)">${(!l.archived&&hasData(l))?`<button class="ghostbtn" title="Retirer de la saisie en gardant l’historique" onclick="archiveLine('${kind}','${id}',${pq})">🗄️ Archiver</button>`:''}<button class="delbtn" onclick="delLine('${kind}','${id}',${pq})">Supprimer</button></div>`;
    if(!l.auto){ const cid='svl_'+esc(id); h+=`<div class="card tight" style="margin:0 0 8px;display:flex;gap:10px;align-items:center"><input type="checkbox" id="${cid}" ${isSavLine(l)?'checked':''} onchange="setLineSaving('${kind}','${id}',${pq},this.checked)" style="width:20px;height:20px;accent-color:var(--accent);flex:0 0 20px"><label for="${cid}" style="flex:1;font-size:13px;cursor:pointer"><b>🐷 Compter comme épargne placée</b>, pas comme dépense</label>${infoTip('Coché : ce que tu saisis ici reste de l’épargne (placée) — ce n’est pas une sortie, ça n’entre ni dans les dépenses ni dans le prorata des communes. Le bilan l’affiche en « dont placée », Projets en « Placée ». Coché d’office dans les groupes nommés Épargne / Investissement / Placement.')}</div>`; }
    if(kind==='foyer'&&people.length>1){ const vm=lv(l,MONTH,fOf(MONTH)); const ps=splitParts(vm,MONTH);
      h+=`<div class="card tight" style="margin:0 0 8px"><div class="barlbl"><b>👥 Part de chacun${infoTip('Mois : prorata des salaires du mois × montant (réel saisi, sinon prévu), au centime. Année : somme des parts mensuelles, chacune avec le prorata de son mois.')}</b><span class="note">${esc(MONTHS[MONTH])} · ${YEARK}</span></div><div class="note" style="margin-top:4px">${people.map((p,i)=>`<b style="color:var(--ink)">${esc(p)}</b> ${ps?eur2(ps[i]):'—'} ce mois · ${eur2(sumM(m=>prorataN(p,m)*lv(l,m,fOf(m))))} sur l’année`).join('<br>')}</div>${prorataNote(MONTH,true)}</div>`; }

function setCell(kind,id,person,m,field,val){ const l= kind==='foyer'? foyerLine(id):persoLine(person,id); if(!l||l.auto)return; l[field]=arr12(l[field],field==='planned'?0:null); l[field][m]=(String(val==null?'':val).trim()==='')?null:roundRule(parseNum(val)); save(); if(DETAIL) renderDetail(); else renderSoft(); } // vide → null (non renseigné) ; « 0 » → 0 (saisi)
function renameLine(kind,id,person,val){ const l= kind==='foyer'? foyerLine(id):persoLine(person,id); if(!l)return; l.name=(val||'').trim()||l.name; save(); renderDetail(); }
function renameGroup(kind,oldName,newName,person){ newName=(newName||'').trim(); if(!newName||newName===oldName){ renderDetail(); return; } const arr= kind==='foyer'? Y().foyer : ((Y().persons[person]||{}).cats||[]); arr.forEach(l=>{ if(l.group===oldName) l.group=newName; }); if(DETAIL&&DETAIL.level==='group'&&DETAIL.group===oldName) DETAIL.group=newName; try{ const ok=(person||'foyer')+'|'+oldName, nk=(person||'foyer')+'|'+newName; if(SCOL[ok]!=null){ SCOL[nk]=SCOL[ok]; delete SCOL[ok]; saveUI(); } }catch(e){} save(); renderDetail(); }
function moveGroup(kind,group,dir,person){ const arr= kind==='foyer'? Y().foyer : ((Y().persons[person]||{}).cats||[]); const groups= kind==='foyer'? foyerGroups() : persoGroups(person); const i=groups.indexOf(group), j=i+dir; if(i<0||j<0||j>=groups.length)return; const t=groups[i]; groups[i]=groups[j]; groups[j]=t; const rank={}; groups.forEach((g,gi)=>rank[g]=gi); const rebuilt=arr.map((l,idx)=>({l,idx})).sort((a,b)=>(rank[a.l.group]-rank[b.l.group])||(a.idx-b.idx)).map(x=>x.l); if(kind==='foyer') Y().foyer=rebuilt; else Y().persons[person].cats=rebuilt; save(); renderDetail(); }
function moveLine(kind,id,person,dir){ const arr= kind==='foyer'? Y().foyer : ((Y().persons[person]||{}).cats||[]); const i=arr.findIndex(l=>l.id===id); if(i<0)return; const g=arr[i].group, a=!!arr[i].archived; let j=-1; if(dir<0){ for(let k=i-1;k>=0;k--){ if(arr[k].group===g&&!!arr[k].archived===a){ j=k; break; } } } else { for(let k=i+1;k<arr.length;k++){ if(arr[k].group===g&&!!arr[k].archived===a){ j=k; break; } } } if(j<0)return; const t=arr[i]; arr[i]=arr[j]; arr[j]=t; save(); renderDetail(); }
function addLine(kind,group,person){ const id=newId(); const line={id,group,name:'Nouvelle ligne',planned:Array(12).fill(0),real:Array(12).fill(0),budget:0}; if(kind==='foyer')Y().foyer.push(line); else (Y().persons[person].cats||(Y().persons[person].cats=[])).push(line); save(); openLine(kind,id,person,group); }
/* --- archivage : champ optionnel l.archived (+archFrom, archYear, archivedAt). Les montants ne sont JAMAIS modifiés. --- */
function hasData(l){ return !!l && !l.auto && ((l.planned||[]).some(v=>v) || (l.real||[]).some(v=>v)); }
function linesOf(kind,person){ return kind==='foyer'? Y().foyer : ((Y().persons[person]||{}).cats||[]); }
function setLineSaving(kind,id,person,on){ const l=lineOf(kind,id,person); if(!l||l.auto)return; l.saving=!!on; save(); if(DETAIL) renderDetail(); else renderKeep(); toast(on?'🐷 Comptée en épargne placée':'Comptée en dépense'); }
function setGroupSaving(kind,group,person,on){ linesOf(kind,person).filter(l=>l.group===group&&!l.auto).forEach(l=>{ l.saving=!!on; }); save(); if(DETAIL) renderDetail(); else renderKeep(); toast(on?'🐷 Groupe compté en épargne placée':'Groupe compté en dépenses'); }
function lineOf(kind,id,person){ return kind==='foyer'? foyerLine(id):persoLine(person,id); }
function markArch(l,on){ if(on){ l.archived=true; l.archFrom=MONTH; l.archYear=+YEARK; l.archivedAt=Date.now(); } else { delete l.archived; delete l.archFrom; delete l.archYear; delete l.archivedAt; } }
function archSince(l){ return l.archFrom!=null? ('depuis '+MSHORT[l.archFrom]+' '+(l.archYear||'')) : ''; }
/* dialogue à choix (feuille au-dessus de la fiche détail) */
function askChoice(o){ let s=document.getElementById('askSheet'); if(!s){ s=document.createElement('div'); s.id='askSheet'; s.className='sheet'; s.style.zIndex='70'; s.innerHTML='<div class="sheetbox"><div class="grip"></div><div id="askBody"></div></div>'; document.body.appendChild(s); s.addEventListener('click',e=>{ if(e.target.id==='askSheet') closeAsk(); }); }
  window.__ask=(o.buttons||[]).map(b=>b.fn);
  document.getElementById('askBody').innerHTML=`<h3 style="margin:4px 2px 8px;font-size:17px;font-weight:850">${o.title||''}</h3><div class="note" style="margin:0 2px 14px;color:var(--ink)">${o.text||''}</div><div style="display:flex;flex-direction:column;gap:8px">${(o.buttons||[]).map((b,i)=>`<button class="${b.cls||'editbtn'}" style="width:100%;padding:12px;font-size:14px" onclick="askPick(${i})">${b.label}</button>`).join('')}</div>`;
  s.classList.add('on'); }
function closeAsk(){ const s=document.getElementById('askSheet'); if(s) s.classList.remove('on'); }
function askPick(i){ const fn=(window.__ask||[])[i]; closeAsk(); if(typeof fn==='function') fn(); }
/* ligne : archiver / restaurer / supprimer (avec explication + confirmation si la ligne contient des données) */
function archiveLine(kind,id,person){ const l=lineOf(kind,id,person); if(!l||l.auto)return; markArch(l,true); save(); toast('Archivée — montants conservés'); if(DETAIL&&DETAIL.level==='line') openGroup(kind,DETAIL.group,person); else if(DETAIL) renderDetail(); else render(); }
function unarchiveLine(kind,id,person){ const l=lineOf(kind,id,person); if(!l)return; markArch(l,false); save(); toast('Restaurée ✓'); if(DETAIL) renderDetail(); else render(); }
function removeLine(kind,id,person){ if(kind==='foyer')Y().foyer=Y().foyer.filter(l=>l.id!==id); else Y().persons[person].cats=(Y().persons[person].cats||[]).filter(l=>l.id!==id); save(); toast('Supprimée · ↩️ Paramètres pour annuler'); detailBack(); }
function delLine(kind,id,person){ const l=lineOf(kind,id,person); if(!l)return;
  if(!hasData(l)){ if(confirm('Supprimer « '+l.name+' » ? (aucun montant saisi)')) removeLine(kind,id,person); return; }
  const nb=(l.real||[]).filter(v=>v).length, tr=sumM(m=>((l.real||[])[m]||0)), tp=sumM(m=>((l.planned||[])[m]||0));
  askChoice({ title:'« '+esc(l.name)+' » contient des montants',
    text:`Réel saisi sur <b>${nb} mois</b> (${eur(tr)}) · prévu ${eur(tp)} sur ${YEARK}.<br><br>🗄️ <b>Archiver</b> : la ligne quitte la saisie et les prévisions à partir de <b>${esc(MONTHS[MONTH])}</b>, mais tout l’historique reste compté (Suivi, Année, parts, épargne). Restaurable à tout moment.<br><br>🗑️ <b>Supprimer</b> : efface définitivement ses montants de ${YEARK} → les totaux et l’épargne des mois passés changent. Les autres années ne sont pas touchées. (↩️ annulable dans Paramètres tant que l’appli reste ouverte.)`,
    buttons:[{label:'🗄️ Archiver (recommandé)',cls:'editbtn',fn:()=>archiveLine(kind,id,person)},{label:'🗑️ Supprimer définitivement',cls:'delbtn',fn:()=>removeLine(kind,id,person)},{label:'Annuler',cls:'ghostbtn',fn:null}] }); }
/* groupe entier */
function archiveGroup(kind,group,person){ const ls=linesOf(kind,person).filter(l=>l.group===group&&!l.archived&&!l.auto); if(!ls.length){ toast('Rien à archiver dans ce groupe'); return; } ls.forEach(l=>markArch(l,true)); save(); toast('Groupe archivé — montants conservés'); closeDetail(); }
function unarchiveGroup(kind,group,person){ linesOf(kind,person).filter(l=>l.group===group&&l.archived).forEach(l=>markArch(l,false)); save(); toast('Groupe restauré ✓'); if(DETAIL) renderDetail(); else render(); }
function removeGroup(kind,group,person){ const keep=l=>l.group!==group; if(kind==='foyer')Y().foyer=Y().foyer.filter(keep); else Y().persons[person].cats=(Y().persons[person].cats||[]).filter(keep); save(); toast('Groupe supprimé · ↩️ Paramètres pour annuler'); closeDetail(); }
function delGroup(kind,group,person){ const ls=linesOf(kind,person).filter(l=>l.group===group); if(!ls.length)return; if(ls.some(l=>l.auto)){ toast('Ce groupe contient la dîme automatique — il ne peut pas être supprimé.'); return; }
  const wd=ls.filter(hasData); if(!wd.length){ if(confirm('Supprimer le groupe « '+group+' » et ses '+ls.length+' ligne(s) vide(s) ?')) removeGroup(kind,group,person); return; }
  const tr=wd.reduce((s,l)=>s+sumM(m=>(l.real||[])[m]||0),0);
  askChoice({ title:'Groupe « '+esc(group)+' » : '+ls.length+' ligne(s), '+wd.length+' avec des montants',
    text:`Réel cumulé ${eur(tr)} sur ${YEARK}.<br><br>🗄️ <b>Archiver</b> : le groupe quitte la saisie et les prévisions à partir de <b>${esc(MONTHS[MONTH])}</b> ; l’historique reste compté partout. Restaurable depuis la section « Archivées ».<br><br>🗑️ <b>Supprimer</b> : efface définitivement toutes ses lignes et leurs montants ${YEARK} → les totaux des mois passés changent. (↩️ annulable dans Paramètres.)`,
    buttons:[{label:'🗄️ Archiver le groupe (recommandé)',cls:'editbtn',fn:()=>archiveGroup(kind,group,person)},{label:'🗑️ Supprimer définitivement',cls:'delbtn',fn:()=>removeGroup(kind,group,person)},{label:'Annuler',cls:'ghostbtn',fn:null}] }); }

/* section « Archivées » (repliée) pour restaurer lignes et groupes */
function archivedBlock(){ const items=[]; Y().foyer.forEach(l=>{ if(l.archived) items.push({l,kind:'foyer',person:null}); }); people.forEach(p=>((Y().persons[p]||{}).cats||[]).forEach(l=>{ if(l.archived) items.push({l,kind:'perso',person:p}); })); if(!items.length) return '';
  const open=!!SCOL.__arch;
  let b=`<div class="card" style="margin-top:14px;padding:8px 10px"><div class="row clk" style="align-items:center;padding:2px 0" onclick="toggleCol('__arch')"><div class="ic sm" style="background:var(--bg2);color:var(--muted)">🗄️</div><div class="nm" style="flex:1"><b>Archivées${infoTip('Lignes retirées de la saisie : leurs montants passés restent comptés partout, leur prévu ne compte plus à partir du mois d’archivage. « Restaurer » les remet en saisie telles qu’elles étaient.')}</b><span>${items.length} ligne(s) hors saisie · historique conservé</span></div><span class="chev">${open?'▾':'▸'}</span></div>`;
  if(open){ const groups=[]; items.forEach(it=>{ const k=(it.person||'foyer')+'|'+it.l.group; if(!groups.includes(k)) groups.push(k); });
    groups.forEach(k=>{ const its=items.filter(it=>(it.person||'foyer')+'|'+it.l.group===k); const {kind,person}=its[0], g=its[0].l.group, pq=person?`'${jsq(person)}'`:'null'; const allArch=linesOf(kind,person).filter(l=>l.group===g).every(l=>l.archived);
      b+=`<div class="row" style="padding:8px 2px 2px"><div class="nm" style="flex:1"><b style="font-size:13px;color:var(--muted)">${esc(g)}${person?' · '+esc(person):''}</b></div>${allArch?`<button class="editbtn" style="font-size:12px" onclick="unarchiveGroup('${kind}','${jsq(g)}',${pq})">Restaurer le groupe</button>`:''}</div>`;
      its.forEach(({l})=>{ const tot=sumM(m=>(l.real||[])[m]||0); b+=`<div class="row"><div class="nm" style="flex:1;min-width:0"><b style="color:var(--muted)">${esc(l.name)}</b><span>${archSince(l)?archSince(l)+' · ':''}réel ${eur(tot)}</span></div><button class="editbtn" onclick="unarchiveLine('${kind}','${l.id}',${pq})">Restaurer</button><button class="delbtn" style="margin-left:6px" title="Supprimer définitivement" onclick="delLine('${kind}','${l.id}',${pq})">🗑️</button></div>`; }); }); }
  return b+'</div>'; }
/* ── VIREMENTS DU MOIS : ce que chacun vire au compte joint (sa part de chaque catégorie commune, au centime) + ses dépenses perso + son épargne placée ; texte partageable (SMS, WhatsApp, partage système) ── */
let VIRF='planned';
function openVirements(){ DETAIL={level:'virements'}; showDetail(); }
function setVirF(f){ VIRF=(f==='real')?'real':'planned'; renderDetail(); }
function virData(m,f){ const ok=prorataOK(m), fg=foyerGroups(), r=a=>Math.round(a.reduce((s,x)=>s+x.amt,0)*100)/100;
  return people.map((p,i)=>{ const part=(g,kind)=>{ const tot=foyerGroupTotal(g,m,f,kind); const ps=(tot&&ok)? splitParts(tot,m) : null; return {g, amt: ps? ps[i] : 0}; };
    const com=fg.map(g=>part(g,'exp')).filter(x=>x.amt>0.004), comSav=fg.map(g=>part(g,'sav')).filter(x=>x.amt>0.004);
    const perso=persoGroups(p).map(g=>({g, amt:Math.round(persoGroupTotal(p,g,m,f,'exp')*100)/100})).filter(x=>x.amt>0.004), persoSav=persoGroups(p).map(g=>({g, amt:Math.round(persoGroupTotal(p,g,m,f,'sav')*100)/100})).filter(x=>x.amt>0.004);
    const tCom=r(com), tComSav=r(comSav), tPerso=r(perso), tPersoSav=r(persoSav), inc=personFullIncome(p,m);
    return {p, ok, pct:pctP(p,m), com, comSav, perso, persoSav, tCom, tComSav, tPerso, tPersoSav, inc, eng:tCom+tComSav+tPerso+tPersoSav, reste:inc-tCom-tComSav-tPerso-tPersoSav}; }); }
function virText(m,f){ const d=virData(m,f), L=['💸 Virements · '+MONTHS[m]+' '+YEARK+' ('+(f==='planned'?'budget prévu':'réel')+')'];
  d.forEach(x=>{ L.push(''); L.push('👤 '+x.p+(x.ok?' — '+x.pct+' des communes':''));
    if(!x.ok) L.push('⚠️ '+PRORATA_NA); else { L.push('→ Virer au compte joint : '+eur2(x.tCom+x.tComSav)); x.com.forEach(c=>L.push('   · '+c.g+' : '+eur2(c.amt))); x.comSav.forEach(c=>L.push('   · '+c.g+' (épargne) : '+eur2(c.amt))); }
    L.push('→ Garder pour ses dépenses perso : '+eur2(x.tPerso)); x.perso.forEach(c=>L.push('   · '+c.g+' : '+eur2(c.amt)));
    if(x.tPersoSav){ L.push('→ Épargne placée : '+eur2(x.tPersoSav)); x.persoSav.forEach(c=>L.push('   · '+c.g+' : '+eur2(c.amt))); }
    L.push('= Engagé '+eur2(x.eng)+' sur '+eur2(x.inc)+' d’entrées · reste '+eur2(x.reste)); });
  L.push(''); L.push('— Budget Famille'); return L.join('\n'); }
function renderVirDetail(){ const head=document.getElementById('detailHead'), body=document.getElementById('detailBody'); const m=MONTH, f=VIRF, d=virData(m,f);
  head.innerHTML=`<div class="dhead"><button class="bk" onclick="closeDetail()">✕</button><h3>💸 Virements du mois</h3><span class="tot">${esc(MSHORT[m])} ${YEARK}<small style="display:block;font-size:11px;color:var(--muted);font-weight:600;text-align:right">${f==='planned'?'budget prévu':'réel'}</small></span></div>`;
  let h=`<div class="seg sub" style="margin:0 0 8px"><button class="${f==='planned'?'on':''}" onclick="setVirF('planned')">📋 Budget prévu</button><button class="${f==='real'?'on':''}" onclick="setVirF('real')">✅ Réel du mois</button></div>`;
  h+=`<div class="note" style="margin:0 2px 8px">Pour chacun : ce qu’il vire au <b>compte joint</b> (sa part de chaque catégorie commune, au prorata des salaires, au centime) et ce qu’il <b>garde</b> pour ses dépenses perso.</div>`;
  const sect=(title,tot,items,emoji)=>{ if(!items.length&&!tot) return ''; let s=`<div class="subline" style="padding:8px 2px 3px"><span class="sn"><b>${emoji} ${title}</b></span><span class="sv">${eur2(tot)}</span></div>`; items.forEach(it=>{ s+=`<div class="subline" style="padding:3px 2px 3px 22px;font-size:13px;border:none"><span class="sn" style="color:var(--muted)">${esc(it.g)}</span><span class="sv" style="font-weight:600">${eur2(it.amt)}</span></div>`; }); return s; };
  d.forEach(x=>{ const c=pcol(x.p); h+=`<div class="card tight" style="margin:0 0 10px"><div class="row" style="padding:0 0 4px"><div class="ic sm" style="background:${tint(c)};color:${c}">👤</div><div class="nm"><b>${esc(x.p)}</b><span>${x.ok?x.pct+' des communes':'répartition non calculable'} · ${eur(x.inc)} d’entrées</span></div><div class="amt">${eur2(x.eng)}<small>engagé</small></div></div>`;

    h+=`<div class="subline" style="border-top:2px solid var(--line);padding-top:8px"><span class="sn"><b>💧 Reste disponible</b></span><span class="sv ${x.reste>=0?'pos':'neg'}">${x.reste>=0?'+':'−'}${eur2(Math.abs(x.reste))}</span></div></div>`; });

  body.innerHTML=h; }
function virCopy(){ const t=virText(MONTH,VIRF); try{ navigator.clipboard.writeText(t).then(()=>toast('Copié ✓')); }catch(e){ const ta=document.getElementById('virTA'); if(ta){ ta.select(); try{ document.execCommand('copy'); }catch(x){} toast('Copié ✓'); } } }
async function virShare(){ const text=virText(MONTH,VIRF); if(navigator.share){ try{ await navigator.share({title:'Virements '+MONTHS[MONTH]+' '+YEARK, text}); return; }catch(e){ if(e&&e.name==='AbortError') return; } } virCopy(); toast('Texte copié — colle-le dans l’appli de ton choix'); }

function doImportCoris(){ const el=document.getElementById('corisTA'); const res=importCoris(el?el.value:''); const m=document.getElementById('corisMsg'); if(m)m.textContent=res.msg; if(res.ok) setTimeout(closeDetail,1000); }
function parseCorisReleve(txt){
  const clean=x=>{ const v=parseFloat((''+x).replace(/[\s]/g,'').replace(',','.')); return isNaN(v)?0:v; };
  const fnum=s=>{ if(s==null)return 0; let v=(''+s).replace(/[\s]/g,'').replace(/[^\d.,\-]/g,'').replace(',','.'); v=parseFloat(v); return isNaN(v)?0:v; };
  const frdate=s=>{ s=(''+s).trim(); let m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if(m){ let y=m[3]; if(y.length===2)y='20'+y; return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); } m=s.match(/(\d{4})-(\d{2})-(\d{2})/); if(m)return m[0]; const n=parseFloat((''+s).replace(',','.')); if(n>40000&&n<60000){ const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000); return d.toISOString().slice(0,10); } return s; };
  const nrm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const lines=(txt||'').replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='');
  if(!lines.length)return [];
  const delim=lines[0].indexOf('\t')>=0?'\t':(lines[0].indexOf(';')>=0?';':null);
  const split=l=>delim?l.split(delim).map(s=>s.trim()):l.split(/\s{2,}/).map(s=>s.trim());
  let idx={type:0,date:1,lib:3,brut:4,frais:5,taxe:6,deb:7,cred:8},start=0;
  const h0=split(lines[0]).map(nrm);
  if(h0.some(x=>x.indexOf('libell')>=0)){ const find=(...ps)=>h0.findIndex(x=>ps.some(p=>x.indexOf(p)>=0)); idx={type:find('type','mvt'),date:find('date'),lib:find('libell'),brut:find('brut'),frais:find('frais'),taxe:find('taxe'),deb:find('debit'),cred:find('credit')}; start=1; }
  const g=(f,i)=>(i>=0&&i<f.length)?f[i]:'';
  const ops=[];
  for(let i=start;i<lines.length;i++){ const f=split(lines[i]); if(f.length<3)continue;
    const nT=nrm(g(f,idx.type)); const lib=g(f,idx.lib)||''; const brut=fnum(g(f,idx.brut)),frais=fnum(g(f,idx.frais)),taxe=fnum(g(f,idx.taxe)),deb=fnum(g(f,idx.deb)),cred=fnum(g(f,idx.cred)); const date=frdate(g(f,idx.date));
    const ma=lib.match(/Achat\s+([\d\s]+?)\s+([A-Za-z][A-Za-z0-9]*)\s*\(\s*Cours\s*:?\s*([\d\s.,]+)\)/i);
    const mv=lib.match(/Vente\s+([\d\s]+?)\s+([A-Za-z][A-Za-z0-9]*)\s*\(\s*Cours\s*:?\s*([\d\s.,]+)\)/i);
    const mdv=lib.match(/DIVIDENDES?\s+[\d\s]+\s+([A-Za-z][A-Za-z0-9]*)/i);
    if(nT.indexOf('achat')>=0&&ma)ops.push({date,sgi:'Coris Bourse',type:'achat',titre:ma[2].toUpperCase(),qty:clean(ma[1]),price:clean(ma[3]),fees:frais+taxe,amount:brut,devise:'XOF'});
    else if(nT.indexOf('vente')>=0&&mv)ops.push({date,sgi:'Coris Bourse',type:'vente',titre:mv[2].toUpperCase(),qty:clean(mv[1]),price:clean(mv[3]),fees:frais+taxe,amount:brut,devise:'XOF'});
    else if(nT.indexOf('depot')>=0||nT.indexOf('versement')>=0||nT.indexOf('virement')>=0)ops.push({date,sgi:'Coris Bourse',type:'depot',titre:'',qty:0,price:0,fees:0,amount:cred||brut,devise:'XOF'});
    else if(nT.indexOf('dividende')>=0)ops.push({date,sgi:'Coris Bourse',type:'dividende',titre:mdv?mdv[1].toUpperCase():'',qty:0,price:0,fees:0,amount:cred||brut,devise:'XOF'});
    else if(nT.indexOf('retrait')>=0)ops.push({date,sgi:'Coris Bourse',type:'retrait',titre:'',qty:0,price:0,fees:0,amount:deb||brut,devise:'XOF'});
    else if(nT.indexOf('tenue')>=0||nT.indexOf('frais')>=0||nT.indexOf('facturation')>=0||nT.indexOf('commission')>=0)ops.push({date,sgi:'Coris Bourse',type:'frais',titre:(lib||'Frais').slice(0,48),qty:0,price:0,fees:0,amount:deb||(frais+taxe)||brut,devise:'XOF'});
  }
  return ops;
}
function importCoris(txt){ txt=(txt||'').trim(); if(!txt)return {ok:false,msg:'Colle d\'abord ton relevé Coris.'};
  let ops=null; try{ const d=JSON.parse(txt); if(Array.isArray(d))ops=d; else if(d&&Array.isArray(d.ops))ops=d.ops; }catch(e){}
  if(ops)ops=ops.map(o=>({date:o.date||'',sgi:'Coris Bourse',type:OP_TYPES.includes(o.type)?o.type:'achat',titre:(o.titre||'').trim(),qty:+o.qty||0,price:+o.price||0,fees:+o.fees||0,amount:+o.amount||0,devise:'XOF'}));
  else ops=parseCorisReleve(txt);
  if(!ops.length)return {ok:false,msg:'⚠️ Rien reconnu. Copie tout le tableau AVEC l\'en-tête.'};
  pfEnsure(); const removed=state.pf.ops.filter(o=>pfMarket(o.sgi)==='BRVM').length; state.pf.ops=state.pf.ops.filter(o=>pfMarket(o.sgi)!=='BRVM'); ops.forEach(o=>state.pf.ops.push(Object.assign({id:newId()},o))); save();
  return {ok:true,msg:'✅ '+ops.length+' opération(s) importée(s), '+removed+' remplacée(s).'};
}

function parseFortuneoReleve(txt){

function importFortuneo(txt){ txt=(txt||'').trim(); if(!txt)return {ok:false,msg:'Colle d\'abord ton relevé Fortuneo (avec l\'en-tête).'};

function importOKX(txt){ txt=(txt||'').trim(); if(!txt)return {ok:false,msg:'Colle d\'abord ton relevé OKX (CSV).'};
  const lines=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  let hi=lines.findIndex(l=>{ const c=l.toLowerCase(); return c.indexOf('type')>=0&&c.indexOf('symbol')>=0&&c.indexOf('amount')>=0; });
  if(hi<0)return {ok:false,msg:'⚠️ En-tête OKX introuvable (id,Time,Type,Amount,…,Symbol).'};
  const delim=lines[hi].indexOf('\t')>=0?'\t':(lines[hi].indexOf(';')>=0?';':','); const H=lines[hi].split(delim).map(s=>s.trim().toLowerCase());
  const iType=H.indexOf('type'), iAmt=H.indexOf('amount'), iSym=H.indexOf('symbol'), iTime=H.indexOf('time'); let iEur=H.findIndex(h=>h.replace(/[\s_-]/g,'')==='amounteur'); if(iEur<0)iEur=H.findIndex(h=>h.indexOf('eur')>=0&&h.indexOf('amount')>=0);
  if(iType<0||iAmt<0||iSym<0)return {ok:false,msg:'⚠️ Colonnes OKX manquantes.'};

    const type=(f[iType]||'').trim().toLowerCase(); const sym=(f[iSym]||'').trim().toUpperCase(); const amt=parseFloat(f[iAmt])||0; const eurv=iEur>=0?Math.abs(parseFloat(f[iEur])||0):0; const time=(f[iTime]||'').trim().slice(0,10);
    if(type.indexOf('trading account')>=0)continue; // transfert interne OKX
    if(sym==='EUR'){ if(type.indexOf('withdraw')>=0){ eurW+=Math.abs(amt); if(time>lastDate)lastDate=time; } else if(type.indexOf('deposit')>=0){ eurD+=Math.abs(amt); } }
    else if(type.indexOf('deposit')>=0){ cIn[sym]=(cIn[sym]||0)+Math.abs(amt); cEur[sym]=(cEur[sym]||0)+eurv; if(time&&time>lastDate)lastDate=time; }
  }
  const netEur=Math.round((eurW-eurD)*100)/100; const date=lastDate||new Date().toISOString().slice(0,10);
  pfEnsure(); const positions=pfPositions().filter(x=>pfMarket(x.sgi)==='Crypto');
  const ALIAS={BTC:'bitcoin',XBT:'bitcoin',ETH:'ethereum',BNB:'binancecoin',SOL:'solana',ADA:'cardano',XRP:'ripple',DOGE:'dogecoin',USDT:'tether',USDC:'usd-coin'};

      if(pos){ const realized=Math.round((share-pos.qty*pos.cmp)*100)/100; state.pf.ops.push({id:newId(),date,sgi:pos.sgi,type:'vente',titre:pos.titre,qty:pos.qty,price:pos.qty?share/pos.qty:0,fees:0,amount:0,devise:'EUR'}); state.pf.ops.push({id:newId(),date,sgi:pos.sgi,type:'retrait',titre:'',qty:0,price:0,fees:0,amount:share,devise:'EUR'}); msg.push(pos.titre+' clôturé à '+eur(share)+' (réalisé '+(realized>=0?'+':'')+eur(realized)+')'); changed=true; }
      else msg.push(sym+' : aucune position crypto ouverte à clôturer'); });
  } else if(netEur>0){ const sig=o=>o.sgi+'|'+o.type+'|'+o.date+'|'+Math.round(o.amount*100); const ex=new Set(state.pf.ops.map(sig)); const o={sgi:'OKX',type:'retrait',date,amount:netEur}; if(!ex.has(sig(o))){ state.pf.ops.push(Object.assign({id:newId(),titre:'',qty:0,price:0,fees:0,devise:'EUR'},o)); msg.push('retrait OKX '+eur(netEur)); changed=true; } else msg.push('retrait déjà enregistré'); }
  else msg.push('aucun mouvement € net à intégrer');
  if(!changed)return {ok:false,msg:'ℹ️ '+msg.join(' · ')+'.'};

const CG_IDS={bitcoin:'bitcoin',btc:'bitcoin',ethereum:'ethereum',eth:'ethereum',bnb:'binancecoin',binancecoin:'binancecoin',solana:'solana',sol:'solana',cardano:'cardano',ada:'cardano',ripple:'ripple',xrp:'ripple',dogecoin:'dogecoin',doge:'dogecoin',polkadot:'polkadot',dot:'polkadot',litecoin:'litecoin',ltc:'litecoin',polygon:'matic-network',matic:'matic-network',avalanche:'avalanche-2',avax:'avalanche-2'};

async function proxyText(url){ let err; for(const mk of PROXIES){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),16000); try{ const r=await fetch(mk(url),{signal:c.signal,cache:'no-store'}); clearTimeout(t); if(r.ok){ let tx=await r.text(); const mi=tx.indexOf('Markdown Content:'); if(mi>=0)tx=tx.slice(mi+17); return tx.trim(); } err=new Error('HTTP '+r.status); }catch(e){ clearTimeout(t); err=e; } } throw err||new Error('proxy indisponible'); }
async function yahooSymbol(p){ const meta=pfMeta2(p.key); if(meta.symbol)return meta.symbol; const hard=EU_SYM[(p.titre||'').toLowerCase().trim()]; if(hard){ meta.symbol=hard; return hard; } try{ const tx=await proxyText('https://query1.finance.yahoo.com/v1/finance/search?q='+encodeURIComponent(p.titre)+'&quotesCount=8'); const j=JSON.parse(tx.slice(tx.indexOf('{'))),qs=(j.quotes||[]).filter(x=>x.symbol); const par=qs.find(x=>x.exchange==='PAR')||qs.find(x=>/\.PA$/.test(x.symbol))||qs[0]; if(par){ meta.symbol=par.symbol; return par.symbol; } }catch(e){} return null; }
async function updatePrices(){ pfEnsure(); const positions=pfPositions(); if(!positions.length){ toast('Aucune position.'); return; } toast('Mise à jour des cours…'); let done=0; const fail=[]; const now=Date.now();
  const okp=(p,src)=>{ state.pf.priceMeta[p.key]={at:now,src,ok:true}; done++; }; const failp=(p,l)=>{ state.pf.priceMeta[p.key]={at:now,ok:false}; fail.push(l||p.titre); };
  const cr=positions.filter(p=>pfMarket(p.sgi)==='Crypto');
  if(cr.length){ try{ const idOf=p=>CG_IDS[(p.titre||'').toLowerCase().trim()]||(p.titre||'').toLowerCase().trim().replace(/\s+/g,'-'); const ids=[...new Set(cr.map(idOf))]; const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+encodeURIComponent(ids.join(','))+'&vs_currencies=eur&_cb='+now,{cache:'no-store'}); const d=await r.json(); cr.forEach(p=>{ const id=idOf(p); if(d[id]&&d[id].eur){ state.pf.prices[p.key]=d[id].eur; okp(p,'CoinGecko'); } else failp(p); }); }catch(e){ cr.forEach(p=>failp(p)); } }
  const bv=positions.filter(p=>pfMarket(p.sgi)==='BRVM');
  if(bv.length){ try{ const h=await proxyText('https://www.brvm.org/en/cours-actions/0'); const map={}; h.split('\n').forEach(ln=>{ const ms=ln.match(/^\s*\|\s*([A-Z0-9]{2,6})\s*\|/); if(!ms)return; const nums=ln.split('|').map(s=>s.trim()).filter(s=>/^[\d][\d\s.,]*$/.test(s)).map(s=>parseFloat(s.replace(/\s/g,'').replace(',','.'))).filter(v=>!isNaN(v)); if(nums.length>=4)map[ms[1]]=nums[3]; else if(nums.length)map[ms[1]]=nums[nums.length-1]; }); const keys=Object.keys(map);
    bv.forEach(p=>{ const meta=pfMeta2(p.key); const t=(p.titre||'').toUpperCase().trim(); const sym=(meta.symbol||'').toUpperCase().trim(); let px=null; if(sym&&map[sym]!=null)px=map[sym]; else if(map[t]!=null)px=map[t]; else if(t.length>=3){ const k=keys.find(k=>k.startsWith(t)||t.startsWith(k)); if(k)px=map[k]; } if(px!=null){ state.pf.prices[p.key]=px; okp(p,'BRVM'); } else failp(p); }); }catch(e){ bv.forEach(p=>failp(p)); } }
  const eu=positions.filter(p=>pfMarket(p.sgi)==='Euronext');
  for(const p of eu){ const sym=await yahooSymbol(p); if(!sym){ failp(p,p.titre+' (ticker ?)'); continue; } try{ const tx=await proxyText('https://query1.finance.yahoo.com/v8/finance/chart/'+sym+'?interval=1d&range=1d'); const m=tx.match(/regularMarketPrice"?\s*:\s*([0-9.]+)/); const price=m?parseFloat(m[1]):null; if(price){ state.pf.prices[p.key]=price; okp(p,'Yahoo'); } else failp(p); }catch(e){ failp(p); } }
  state.pf.pricesUpdatedInfo={at:now,ok:done,fail:fail.length}; save(); render(); toast('OK '+done+' cours à jour'+(fail.length?(' · échec : '+fail.slice(0,3).join(', ')):''));
}

function setDeduc(id,field,val){ const d=dedItem(id); if(!d)return; d[field]=(field==='montant'||field==='rate')?parseNum(val):(field==='month'?(+val||0):val); save(); if(DETAIL)renderDetail(); else render(); }
function addDeduc(){ const d={id:newId(),month:MONTH,label:'Don / dîme',montant:0,rate:66}; dedList().push(d); save(); openDeduc(d.id); }

  body.innerHTML=h;
}
