/* ===== Synchro temps réel (Firebase Realtime DB) — portée de l'appli classique ===== */
const SYNC_KEY='budgetV3_sync';
const SYNC_DEFAULT=null; // ← config intégrée pour les NOUVEAUX appareils : {config:{…firebaseConfig…}, code:'…'} — une fois renseignée, zéro manip partout
let syncCfg={enabled:false,config:null,code:'',device:null,lastRev:0};
let syncRef=null, myRev=0, pushTimer=null, syncMsg='', lastPushedData='';
function loadSyncCfg(){ try{ const r=localStorage.getItem(SYNC_KEY); if(r) syncCfg=Object.assign(syncCfg,JSON.parse(r)); }catch(e){}
  if(!syncCfg.config||!syncCfg.code){ try{ const c=JSON.parse(localStorage.getItem('budgetFamille_sync')||'null'); if(c&&c.config&&c.code){ syncCfg.config=syncCfg.config||c.config; syncCfg.code=syncCfg.code||c.code; } }catch(e){} } // hérite la config de l'ancienne appli (même origine)
  if((!syncCfg.config||!syncCfg.code)&&SYNC_DEFAULT&&SYNC_DEFAULT.config&&SYNC_DEFAULT.code){ syncCfg.config=syncCfg.config||SYNC_DEFAULT.config; syncCfg.code=syncCfg.code||SYNC_DEFAULT.code; } // config intégrée (nouveaux appareils)
  if(syncCfg.config&&syncCfg.code&&!syncCfg.userOff) syncCfg.enabled=true; // AUTO : dès qu'une config existe, la synchro est active — zéro manip
  if(!syncCfg.device) syncCfg.device='d'+Math.random().toString(36).slice(2,10); myRev=syncCfg.lastRev||0; saveSyncCfg(); }
function saveSyncCfg(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); }catch(e){} }
function setSyncMsg(s){ syncMsg=s; const el=document.getElementById('syncStatus'); if(el) el.textContent=s; }
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Échec de chargement Firebase (connexion ?)')); document.head.appendChild(s); }); }
function parseFirebaseConfig(txt){ if(!txt) return null; try{ return JSON.parse(txt); }catch(e){} const m=txt.match(/\{[\s\S]*\}/); if(m){ try{ return Function('return ('+m[0]+')')(); }catch(e){} } return null; }
async function ensureFirebase(){ if(window.firebase&&firebase.database) return; await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'); await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js'); }
/* ── FUSION 3 VOIES (base commune / local / cloud) : plus de « dernier qui pousse gagne ». Chaque cellule, ligne, projet est fusionné : une modif locale non poussée n'est jamais écrasée, une suppression locale reste supprimée, un ajout distant est intégré. ── */
let SYNC_BASE=null; // dernier état CONNU DU CLOUD (ancêtre commun), persisté par appareil
function loadBase(){ try{ SYNC_BASE=JSON.parse(localStorage.getItem('budgetV3_syncBase')||'null'); }catch(e){ SYNC_BASE=null; } }
function saveBase(d){ SYNC_BASE=d; try{ localStorage.setItem('budgetV3_syncBase', JSON.stringify(d)); }catch(e){} }
// Forme canonique « façon Firebase » (null / vide = absent, tableaux = objets indexés, clés triées) → deux états sont égaux s'ils donnent le même cloud. Évite les ping-pong d'envois entre appareils.
function fbCanon(x){ if(x===null||x===undefined) return undefined; if(typeof x==='number'&&!isFinite(x)) return undefined;
  if(Array.isArray(x)){ const o={}; x.forEach((v,i)=>{ const c=fbCanon(v); if(c!==undefined) o[i]=c; }); return Object.keys(o).length? o : undefined; }
  if(typeof x==='object'){ const o={}; Object.keys(x).sort().forEach(k=>{ const c=fbCanon(x[k]); if(c!==undefined) o[k]=c; }); return Object.keys(o).length? o : undefined; }
  return x; }
const canonStr=x=>JSON.stringify(fbCanon(x))||'';
const _j=x=>JSON.stringify(x===undefined?null:x), _isObj=x=>x&&typeof x==='object'&&!Array.isArray(x), _byId=a=>Array.isArray(a)&&a.length>0&&a.every(x=>x&&typeof x==='object'&&x.id!=null);
function m3(b,l,r,pref){ // b = base (undefined si inconnue) ; pref = 'l'|'r' pour trancher sans base
  const noB=(b===undefined);
  if(Array.isArray(l)||Array.isArray(r)){
    const L=Array.isArray(l)?l:[], R=Array.isArray(r)?r:[], B=Array.isArray(b)?b:null;
    if(_byId(L)||_byId(R)){ const bm=new Map((B||[]).filter(x=>x&&x.id!=null).map(x=>[x.id,x])), rm=new Map(R.filter(x=>x&&x.id!=null).map(x=>[x.id,x])); const out=[], seen=new Set();
      L.forEach(x=>{ if(!x||x.id==null){ out.push(x); return; } seen.add(x.id); const bx=bm.get(x.id), rx=rm.get(x.id);
        if(rx!==undefined) out.push(m3(bx,x,rx,pref)); else if(noB||bx===undefined||_j(x)!==_j(bx)) out.push(x); /* sinon supprimé à distance, inchangé localement → retiré */ });
      R.forEach(x=>{ if(!x||x.id==null||seen.has(x.id)) return; const bx=bm.get(x.id); if(noB||bx===undefined||_j(x)!==_j(bx)) out.push(x); /* sinon supprimé localement → reste supprimé */ });
      return out; }
    const n=Math.max(L.length,R.length,B?B.length:0), out=[];
    for(let i=0;i<n;i++){ const lv_=L[i], rv_=R[i], bi=B?B[i]:undefined; if(noB){ const ls=lv_!=null, rs=rv_!=null; out[i]= (ls&&!rs)? lv_ : (rs&&!ls)? rv_ : (pref==='r'? (rv_===undefined?lv_:rv_) : (lv_===undefined?rv_:lv_)); } else { out[i]= (_j(lv_)!==_j(bi)) ? lv_ : (rv_===undefined? lv_ : rv_); } }
    return out; }
  if(_isObj(l)||_isObj(r)){ const L=_isObj(l)?l:{}, R=_isObj(r)?r:{}, B=_isObj(b)?b:null, out={};
    new Set([...Object.keys(L),...Object.keys(R)]).forEach(k=>{ const bk=B?B[k]:undefined, lk=L[k], rk=R[k];
      if(lk!==undefined&&rk!==undefined) out[k]=m3(noB?undefined:bk,lk,rk,pref);
      else if(lk!==undefined){ if(noB||bk===undefined||_j(lk)!==_j(bk)) out[k]=lk; }
      else { if(noB||bk===undefined||_j(rk)!==_j(bk)) out[k]=rk; } });
    return out; }
  if(noB) return (pref==='r')? (r===undefined?l:r) : (l===undefined?r:l);
  return (_j(l)!==_j(b)) ? l : r;
}
function mergeRemote(r){ // fusionne r.state dans l'état local ; renvoie {needPush, changed}
  const remote=JSON.parse(JSON.stringify(r.state||{})); if(!remote.years||typeof remote.years!=='object'||!Object.keys(remote.years).length){ lastPushedData=''; return {needPush:true,changed:false}; } normalizeState(remote);
  const local=JSON.parse(JSON.stringify(syncData())); const cloudNewer=(r.rev||0)>=((local.lastEdit)||0);
  const merged=m3(SYNC_BASE||undefined, local, remote, cloudNewer?'r':'l');
  merged.lastEdit=Math.max(local.lastEdit||0, remote.lastEdit||0); if(local.migNull===1||remote.migNull===1) merged.migNull=1; if(local.migProj===1||remote.migProj===1) merged.migProj=1; const prv=Math.max(local.projectsRev||0, remote.projectsRev||0); if(prv) merged.projectsRev=prv; else delete merged.projectsRev;
  const {ui,currentYear}=state; state=JSON.parse(JSON.stringify(merged)); if(ui!==undefined) state.ui=ui; if(currentYear!==undefined) state.currentYear=currentYear;
  normalizeState(state); migNullState(state); migProjectsState(state);
  if(!state.years[YEARK]) YEARK=Number(Object.keys(state.years).sort((a,b)=>a-b)[0])||YEARK;
  try{ localStorage.setItem('budgetFamille_v1',JSON.stringify(state)); }catch(e){}
  const mergedC=canonStr(syncData()), remoteC=canonStr(remote), localC=canonStr(local);
  saveBase(remote); myRev=Math.max(myRev||0, r.rev||0); syncCfg.lastRev=myRev; saveSyncCfg(); // base = ce que contient le cloud → nos modifs non envoyées restent « locales » jusqu'à l'envoi
  lastPushedData=(mergedC===remoteC)? remoteC : '';
  if(!LIVE){ location.reload(); return {needPush:false,changed:true}; }
  if(mergedC!==localC){ const a=document.activeElement; if(a&&a.classList&&a.classList.contains('medit')) RDIRTY=true; else { try{ renderKeep(); if(DETAIL) renderDetail(); }catch(e){ render(); } } }
  return {needPush:mergedC!==remoteC, changed:mergedC!==localC};
}
let pushRetry=null;
function nextRev(){ myRev=Math.max(Date.now(), (myRev||0)+1); syncCfg.lastRev=myRev; saveSyncCfg(); return myRev; } // monotone : insensible aux horloges décalées entre appareils
function pushNow(){ if(!syncRef) return; let d; try{ d=JSON.parse(JSON.stringify(syncData())); }catch(e){ return; } const cs=canonStr(d); if(cs===lastPushedData) return; lastPushedData=cs; const rev=nextRev();
  let p; try{ p=syncRef.set({rev,device:syncCfg.device,state:d}); }catch(e){ p=Promise.reject(e); }
  p.then(()=>{ saveBase(d); setSyncMsg('✅ Synchronisé '+new Date().toLocaleTimeString('fr-FR')); try{ renderBadgeOnly(); }catch(e){} })
   .catch(e=>{ lastPushedData=''; setSyncMsg('⚠️ Envoi refusé : '+(e&&e.message||e)); try{ renderBadgeOnly(); }catch(e2){} clearTimeout(pushRetry); pushRetry=setTimeout(()=>pushRemote(true),8000); }); }
function flushPush(){ try{ if(pushTimer){ clearTimeout(pushTimer); pushTimer=null; pushNow(); } }catch(e){} }
function renderBadgeOnly(){ const el=document.getElementById('syncBadgeBox'); if(el) el.outerHTML=syncBadge(); }
async function syncDiag(){ setSyncMsg('🩺 Test…'); try{ await ensureFirebase(); if(!firebase.apps.length) firebase.initializeApp(syncCfg.config); const ref=firebase.database().ref('budgets/'+syncCfg.code);
  let rd='?', wr='?'; try{ const s=await ref.child('rev').once('value'); rd='lecture OK'+(s.exists()?' (données présentes)':' (cloud vide)'); }catch(e){ rd='lecture REFUSÉE ('+(e.message||e)+')'; }
  try{ await ref.child('_ping').set(Date.now()); wr='écriture OK'; }catch(e){ wr='écriture REFUSÉE ('+(e.message||e)+')'; }
  const bad=/REFUS/.test(rd+wr); setSyncMsg((bad?'⚠️ ':'✅ ')+rd+' · '+wr+(bad?' — Règles Firebase probablement expirées (mode test 30 j) : console.firebase.google.com → Realtime Database → Règles → mettre { "rules": { "budgets": { "$c": { ".read": true, ".write": true } } } } → Publier.':'')); render(); }catch(e){ setSyncMsg('⚠️ '+(e.message||e)); render(); } }
function syncData(){ const {ui, currentYear, ...d}=state; return d; }          // on ne synchronise QUE les données (pas la nav/thème)
function onRemote(r){ if(!r||!r.state) return; if((r.rev||0)<=myRev) return; const res=mergeRemote(r); if(res.needPush) pushRemote(true); if(res.changed) toast('🔄 Données mises à jour'); }
function pushRemote(now){ if(!syncRef) return; if(canonStr(syncData())===lastPushedData) return; clearTimeout(pushTimer); pushTimer=null; if(now) pushNow(); else pushTimer=setTimeout(()=>{ pushTimer=null; pushNow(); },300); }
async function initSync(seed){ if(!syncCfg.enabled||!syncCfg.config||!syncCfg.code) return; try{ setSyncMsg('Connexion…'); await ensureFirebase(); if(!firebase.apps.length) firebase.initializeApp(syncCfg.config); syncRef=firebase.database().ref('budgets/'+syncCfg.code); loadBase();
  const snap=await syncRef.once('value'); const r=snap.val();
  if(r&&r.state){ const res=mergeRemote(r); if(res.needPush) pushRemote(true); } else { lastPushedData=''; pushRemote(true); } // à la connexion : fusion puis envoi de ce qui manque au cloud
  syncRef.on('value', s=>onRemote(s.val()), e=>{ setSyncMsg('⚠️ Lecture refusée : '+(e&&e.message||e)); try{ renderBadgeOnly(); }catch(e2){} });
  if(!/^⚠️/.test(syncMsg)) setSyncMsg('✅ Connecté ('+syncCfg.code+')'); try{ renderBadgeOnly(); }catch(e){} }catch(e){ setSyncMsg('⚠️ '+(e&&e.message||e)); try{ renderBadgeOnly(); }catch(e2){} } }
function disableSync(){ try{ if(syncRef) syncRef.off(); }catch(e){} syncRef=null; syncCfg.enabled=false; syncCfg.userOff=true; saveSyncCfg(); setSyncMsg('Désactivée'); render(); }
function syncOn(){ const cfg=parseFirebaseConfig((document.getElementById('syncConfig')||{}).value||''); const code=((document.getElementById('syncCode')||{}).value||'').trim(); if(!cfg||!cfg.databaseURL){ toast('Config Firebase invalide (databaseURL manquant)'); return; } if(!code){ toast('Choisis un code partagé'); return; } syncCfg.config=cfg; syncCfg.code=code; syncCfg.enabled=true; syncCfg.userOff=false; saveSyncCfg(); render(); initSync(true); toast('Synchro en cours…'); }
function syncOff(){ if(confirm('Désactiver la synchro sur cet appareil ? (tes données restent enregistrées ici)')) disableSync(); }
function syncPush(){ lastPushedData=''; pushRemote(true); toast('Envoi au cloud…'); }
